<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>1-hafta testi</title>
<link rel="icon" href="../../../reveal/logo.png">
<script src="../../../reveal/tema.js"></script>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--mut:#667;--card:#f4f5f7;--bd:#d5d8de;--ac:#2a6df4;--ok:#1a8f4a;--okbg:#e3f6ea;--no:#c62828;--nobg:#fdeaea}
[data-theme=dark]{--bg:#1e1e1e;--fg:#eee;--mut:#9aa;--card:#2a2b2e;--bd:#44464b;--ac:#5b9bff;--ok:#4cc77f;--okbg:#17321f;--no:#ff7b72;--nobg:#3a1c1c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:40px;height:40px;object-fit:contain}
h1{font-size:1.15rem;line-height:1.3;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:8px 0 14px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:8px;display:none}
.explain.show{display:block}
code{font-family:ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:.92em}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
.foot div{max-width:720px;margin:0 auto}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding:12px 0}.res .n{font-size:3rem;font-weight:700}
.rev{margin-top:16px;display:grid;gap:10px;text-align:left}
.rev div{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.rev small{color:var(--mut)}
.theme-toggle{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:0;display:grid;place-items:center;z-index:5;cursor:pointer}.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
header{padding-right:48px}.opt{-webkit-tap-highlight-color:transparent;user-select:none}
@media(min-width:700px){body{font-size:18px}.wrap{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="../../../reveal/logo.png" alt="AXV"><h1>1-hafta testi</h1></header>
<div class="badges"><span class="badge">10-sinf Kiberxavfsizlik · 1-hafta</span><span class="badge">20 ta savol &amp;middot; taxminan 18 daqiqa</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<main id="card"></main>
</div>
<div class="foot"><div><button class="btn" id="next" type="button" disabled>Keyingi savol</button></div></div>
<script type="application/json" id="qdata">[{"q": "Axborot xavfsizligi va kiberxavfsizlik o'rtasidagi munosabat qanday?", "o": ["Kiberxavfsizlik axborot xavfsizligining raqamli/kibermakondagi qismi hisoblanadi", "Ular bir-biriga aloqasi yo'q mustaqil sohalar", "Axborot xavfsizligi kiberxavfsizlikning kichik qismidir", "Ikkalasi ham faqat qog'oz hujjatlarga tegishli"], "a": 0, "e": "Axborot xavfsizligi keng qamrovli tushuncha, kiberxavfsizlik esa uning kibermakondagi (raqamli) qismi."}, {"q": "Bob va Alisa o'rtasidagi aloqani tutib olib, yetkazib berish manzilini o'zgartirgan Tridi qanday xatti-harakat qilgan hisoblanadi?", "o": ["Passiv kuzatuvchi", "Faol hujumchi (ma'lumotni o'zgartirgan)", "Qonuniy ishtirokchi", "Tizim administratori"], "a": 1, "e": "Tridi nafaqat o'qidi, balki ma'lumotni o'zgartirdi — bu faol hujumchi xatti-harakati."}, {"q": "O'RQ-764-sonli qonunga ko'ra, kritik axborot infratuzilmasi subyektlari qanday majburiyatga ega?", "o": ["Faqat yillik moliyaviy hisobot topshirish", "Faqat xodimlar maoshini oshirish", "Kiberhujumlar haqida vakolatli organga xabar berish va monitoring olib borish", "Internetga ulanishni butunlay taqiqlash"], "a": 2, "e": "Qonunga ko'ra subyektlar monitoring olib borishi, ekspertizadan o'tishi va hodisalar haqida xabar berishi shart."}, {"q": "Routerda 22-portni faqat VPN foydalanuvchilari uchun ochish qaysi xavfsizlik sohasiga tegishli?", "o": ["Cloud Security", "Application Security", "Endpoint Security", "Network Security"], "a": 3, "e": "Tarmoq portlarini va marshrutlashni boshqarish — Tarmoq xavfsizligi (Network Security) sohasiga kiradi."}, {"q": "Kiberjinoyatchilarning asosiy motivatsiyalaridan biri sifatida qaysi biri to'g'ri?", "o": ["Moliyaviy foyda olish", "Faqat elektr energiyasini tejash", "Internet tezligini oshirish", "Kompyuter dizaynini yaxshilash"], "a": 0, "e": "Moliyaviy foyda (to'lov talab qilish, karta ma'lumotlarini o'g'irlash) eng keng tarqalgan motivatsiyalardan biri."}, {"q": "AOB bank tizimida Tridining ketma-ket noto'g'ri parollarni sinab ko'rishiga (brute-force) qarshi qaysi chora samarali?", "o": ["Parolni ekranga chiqarib qo'yish", "Account Lockout: ketma-ket xato urinishdan so'ng hisobni vaqtincha bloklash", "Serverni butunlay o'chirib qo'yish", "Parolni hech qachon o'zgartirmaslik"], "a": 1, "e": "Ketma-ket noto'g'ri urinishlardan so'ng hisobni vaqtincha bloklash brute-force hujumini sekinlashtiradi."}, {"q": "Troyan oti (Trojan Horse) qanday tamoyil asosida ishlaydi?", "o": ["Tarmoq orqali odam ishtirokisiz o'zi tarqaladi", "Faqat elektron pochta orqali tarqaladi", "O'zini foydali/xavfsiz dastur qilib ko'rsatadi, foydalanuvchi o'zi o'rnatadi", "Faqat Wi-Fi tarmoqlarida ishlaydi"], "a": 2, "e": "Troyan o'zini foydali dastur (o'yin, aktivator) sifatida ko'rsatadi va foydalanuvchi o'z qo'li bilan o'rnatadi."}, {"q": "Botnet C2 (Command and Control) serveri huquq-tartibot organlari tomonidan o'chirilsa, an'anaviy markazlashgan botnetga nima bo'ladi?", "o": ["Botlar yanada kuchliroq ishlay boshlaydi", "Botlar avtomatik o'zini o'chiradi", "Hech narsa o'zgarmaydi", "Botlar yetim (orphaned) bo'lib, buyruq ololmay qoladi"], "a": 3, "e": "Markaziy C2 server bloklansa, an'anaviy markazlashgan botnet boshqaruvi yo'qoladi va botlar buyruqsiz qoladi."}, {"q": "Nginx yoki Apache serverni Slowloris hujumidan himoyalashning samarali chorasi qaysi?", "o": ["Ulanish va so'rov timeout vaqtlarini qisqartirish hamda bitta IP uchun ulanish sonini cheklash", "Serverni butunlay o'chirib qo'yish", "HTTPS ni butunlay o'chirib qo'yish", "Barcha portlarni ochiq qoldirish"], "a": 0, "e": "Timeout parametrlarini qisqartirish va bitta IP dan ulanishlar sonini cheklash Slowloris hujumini samarasiz qiladi."}, {"q": "PowerShell Slowloris skriptida `Start-Sleep -Seconds 300` buyrug'i nima uchun ishlatilgan?", "o": ["Skriptni butunlay to'xtatish uchun", "Ochilgan TCP soketni uzoq vaqt band qilib turish uchun", "Serverga parol yuborish uchun", "Internetni tezlashtirish uchun"], "a": 1, "e": "Bu buyruq soketni yopmasdan, 5 daqiqa davomida ochiq ushlab, server resursini band qilib turadi."}, {"q": "Spam elektron xat bilan fishing xati o'rtasidagi asosiy farq nimada?", "o": ["Spam har doim fishingdan xavfliroq", "Ular bir xil tushuncha", "Fishing aniq niyat bilan shaxsiy ma'lumotlarni o'g'irlashga qaratilgan, spam esa ommaviy reklama", "Spam faqat SMS orqali yuboriladi"], "a": 2, "e": "Spam — ommaviy reklama (zararsiz bo'lishi mumkin), fishing esa aniq firibgarlik maqsadida ma'lumot o'g'irlashga qaratilgan."}, {"q": "Whaling (Whale Phishing) hujumi nima sababdan aynan kompaniya rahbarlariga qaratiladi?", "o": ["Rahbarlar parolni hech qachon almashtirmaydi", "Rahbarlar kompyuterdan umuman foydalanmaydi", "Bu tasodifiy tanlov, sababsiz", "Rahbarlar katta moliyaviy mablag' va maxfiy ma'lumotlarga kirish huquqiga ega"], "a": 3, "e": "Rahbarlar katta mablag'larni boshqargani va maxfiy ma'lumotlarga ega bo'lgani uchun muvaffaqiyatli whaling katta foyda keltiradi."}, {"q": "Windowsda kutilmagan manzildan kelgan `hisob-faktura.pdf.exe` fayli nima uchun xavfli?", "o": ["Haqiqiy kengaytmasi `.exe` bo'lib, yashirin ishga tushuvchi zararli dastur bo'lishi mumkin", "Chunki PDF fayllari har doim xavfli", "Chunki fayl hajmi juda katta", "Chunki u faqat Linuxda ochiladi"], "a": 0, "e": "Windows ba'zan kengaytmani yashiradi, foydalanuvchi PDF deb o'ylab aslida ishga tushuvchi `.exe` faylni ochib yuborishi mumkin."}, {"q": "`Received: from mail.attacker-server.ru` yozuvi `From: ceo@company.uz` bilan birga kelsa, bu nimani fosh qiladi?", "o": ["Hech narsani, bu normal holat", "Xatning soxtalashtirilganini (Email Spoofing) — texnik manba boshqa joydan ekanligini", "Xat juda tez yetib kelganini", "Direktor Rossiyada ekanligini"], "a": 1, "e": "Xat matnida mahalliy direktor ko'rsatilgan bo'lsa-da, texnik uzatish shubhali tashqi serverdan amalga oshirilgani — bu soxtalashtirish belgisi."}, {"q": "Buxgalterga «direktor»dan shoshilinch pul o'tkazish haqida xat kelsa, u birinchi navbatda nima qilishi shart?", "o": ["Darhol pulni o'tkazish, chunki rahbar yozgan", "Xatni o'chirib, hech kimga aytmaslik", "Muqobil kanal (telefon qo'ng'irog'i) orqali rahbar bilan bog'lanib tasdiqlash", "Xatga darhol javob yozib parolni yuborish"], "a": 2, "e": "Out-of-band verification — faqat elektron xatga tayanmasdan, boshqa kanal orqali tasdiqlash BEC hujumidan himoya qiladi."}, {"q": "1-dars (aktiv/zaiflik), 2-dars (malware/DoS) va 3-dars (fishing) mavzularini birlashtiruvchi umumiy g'oya nima?", "o": ["Faqat qimmat uskuna sotib olish xavfsizlikni kafolatlaydi", "Internetni butunlay o'chirib qo'yish kerak", "Faqat qonunni bilish yetarli, texnik bilim shart emas", "Aktivlarni bilish, texnik tahdidlarni (malware, DoS) va inson omiliga qaratilgan (fishing) tahdidlarni anglash birgalikda himoyani ta'minlaydi"], "a": 3, "e": "Kiberxavfsizlik aktivlarni bilish, texnik tahdidlardan va ijtimoiy muhandislikdan himoyalanishning uyg'un kombinatsiyasidir."}, {"q": "Qurbon kompyuteriga troyan orqali ransomware yuqtirilib, so'ng fayllar shifrlanadi. Bu zanjirda qaysi ketma-ketlik to'g'ri?", "o": ["Fishing xati orqali troyan yuklanadi, troyan ichidagi ransomware ishga tushib fayllarni shifrlaydi", "Avval DoS, keyin fishing, keyin troyan", "Avval ransomware, keyin u troyanni yaratadi", "Bu hodisalar bir-biriga aloqasiz"], "a": 0, "e": "Ko'p hujumlar fishing xati bilan boshlanadi — foydalanuvchi troyanni o'rnatadi, u esa ransomware kabi zararli yukni ishga tushiradi."}, {"q": "Hujumchi DDoS orqali serverni band qilib, shu bilan bir vaqtda xodimlarga fishing xati yuborsa, bu nimani ko'rsatadi?", "o": ["Bu ikki usul birga ishlatilishi mumkin emas", "Zamonaviy hujumlar ko'pincha bir nechta texnika (texnik va ijtimoiy muhandislik) birgalikda qo'llaniladi", "Faqat bitta usul yetarli bo'lishi shart", "Bu holatda DDoS foydasiz hisoblanadi"], "a": 1, "e": "Real hujumlarda xodimlarning chalg'ishidan foydalanish (DDoS e'tiborni chalg'itadi) va fishing birgalikda qo'llanilishi mumkin."}, {"q": "Kompaniyada xavfsizlik madaniyatini oshirish uchun qaysi chora barcha 3 ta darsga (aktivlar, malware, fishing) tegishli bo'lgan umumiy yondashuv hisoblanadi?", "o": ["Faqat yangi kompyuter sotib olish", "Internetni butunlay o'chirish", "Xodimlarni muntazam o'qitish (Security Awareness) va aktivlarni to'g'ri inventarizatsiya qilish", "Faqat antivirus o'rnatish, boshqa chora shart emas"], "a": 2, "e": "Xodimlarni o'qitish va aktivlarni bilish — texnik va inson omiliga qaratilgan tahdidlarning barchasiga qarshi asosiy himoya."}, {"q": "1-haftada o'rganilgan mavzularning umumiy ketma-ketligi qanday edi?", "o": ["Avval tarmoq topologiyasi, keyin OSI modeli", "Avval CIA triadasi, keyin STRIDE modeli", "Faqat parollar xavfsizligi mavzusi o'rganildi", "Kiberxavfsizlik asoslari va qonunchilik, so'ng malware/DoS hujumlari, so'ng ijtimoiy muhandislik va fishing"], "a": 3, "e": "1-hafta: 1-dars asoslar va qonun, 2-dars malware/DoS, 3-dars ijtimoiy muhandislik va fishing tahlili bilan yakunlandi."}]</script>
<script>
(function(){
var Q=JSON.parse(document.getElementById('qdata').textContent),i=0,score=0,wrong=[],done=false;
var $=function(s){return document.querySelector(s)},card=$('#card'),next=$('#next');
function esc(t){return t}
function show(){
  var q=Q[i];done=false;
  $('#cnt').textContent='Savol '+(i+1)+' / '+Q.length;$('#sc').textContent='To\u2018g\u2018ri: '+score;
  $('#fill').style.width=(i/Q.length*100)+'%';
  var h='<p class="q">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,k){h+='<button class="opt" type="button" data-k="'+k+'"><b>'+'ABCDEFGH'[k]+'</b><span>'+o+'</span></button>'});
  h+='</div><div class="explain" id="ex"></div>';card.innerHTML=h;
  next.textContent=i==Q.length-1?'Natijani ko\u2018rish':'Keyingi savol';next.disabled=true;
  card.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){pick(+b.dataset.k)})});
  window.scrollTo(0,0);
}
function pick(k){
  if(done)return;done=true;var q=Q[i],bs=card.querySelectorAll('.opt');
  bs.forEach(function(b,j){b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  if(k==q.a)score++;else wrong.push({q:q.q,y:q.o[k],c:q.o[q.a]});
  var ex=$('#ex');ex.innerHTML=(k==q.a?'<b>To\u2018g\u2018ri!</b> ':'<b>Noto\u2018g\u2018ri.</b> ')+(q.e||'');ex.classList.add('show');
  $('#sc').textContent='To\u2018g\u2018ri: '+score;next.disabled=false;
  ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  var p=Math.round(score/Q.length*100);
  $('#fill').style.width='100%';$('#cnt').textContent='Natija';
  var msg=p>=90?'Ajoyib!':p>=70?'Yaxshi natija!':p>=50?'Yomon emas, takrorlab ko\u2018ring.':'Mavzuni qayta o\u2018qib chiqing.';
  var h='<div class="res"><div class="n">'+score+' / '+Q.length+'</div><div>'+p+'% \u2014 '+msg+'</div></div>';
  if(wrong.length){h+='<h3>Xatolar tahlili</h3><div class="rev">';wrong.forEach(function(w){h+='<div><b>'+w.q+'</b><br><small>Sizning javobingiz: '+w.y+'</small><br>To\u2018g\u2018ri javob: '+w.c+'</div>'});h+='</div>'}
  card.innerHTML=h;next.textContent='Qayta urinish';next.disabled=false;next.onclick=function(){i=0;score=0;wrong=[];next.onclick=adv;show()};
  window.scrollTo(0,0);
}
function adv(){if(i<Q.length-1){i++;show()}else finish()}
next.onclick=adv;
document.addEventListener('keydown',function(e){
  var n=parseInt(e.key,10);if(n>=1&&n<=Q[i].o.length&&!done&&card.querySelector('.opt'))pick(n-1);
  else if((e.key=='Enter'||e.key==' ')&&!next.disabled&&document.activeElement.tagName!='BUTTON'){e.preventDefault();next.onclick()}
});
show();
})();
</script>
</body>
</html>
