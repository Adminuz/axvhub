<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>3-hafta testi</title>
<link rel="icon" href="../../../reveal/logo.png">
<script src="../../../reveal/tema.js"></script>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--mut:#667;--card:#f4f5f7;--bd:#d5d8de;--ac:#2a6df4;--ok:#1a8f4a;--okbg:#e3f6ea;--no:#c62828;--nobg:#fdeaea}
[data-theme=dark]{--bg:#1e1e1e;--fg:#eee;--mut:#9aa;--card:#2a2b2e;--bd:#44464b;--ac:#5b9bff;--ok:#4cc77f;--okbg:#17321f;--no:#ff7b72;--nobg:#3a1c1c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:40px;height:40px;object-fit:contain}
h1{font-size:1.15rem;line-height:1.3;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:8px 0 14px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:8px;display:none}
.explain.show{display:block}
code{font-family:ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:.92em}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
.foot div{max-width:720px;margin:0 auto}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding:12px 0}.res .n{font-size:3rem;font-weight:700}
.rev{margin-top:16px;display:grid;gap:10px;text-align:left}
.rev div{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.rev small{color:var(--mut)}
.theme-toggle{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:0;display:grid;place-items:center;z-index:5;cursor:pointer}.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
header{padding-right:48px}.opt{-webkit-tap-highlight-color:transparent;user-select:none}
@media(min-width:700px){body{font-size:18px}.wrap{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="../../../reveal/logo.png" alt="AXV"><h1>3-hafta testi</h1></header>
<div class="badges"><span class="badge">10-sinf Kiberxavfsizlik · 3-hafta</span><span class="badge">20 ta savol &amp;middot; taxminan 18 daqiqa</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<main id="card"></main>
</div>
<div class="foot"><div><button class="btn" id="next" type="button" disabled>Keyingi savol</button></div></div>
<script type="application/json" id="qdata">[{"q": "Raqamli gigiyenaning qaysi qoidasi brauzer kengaytmalari (uBlock Origin, ClearURLs) bilan bevosita bog'liq?", "o": ["Faqat HTTPS dan foydalanish, treker va reklamalarni bloklash", "Har bir xizmatga alohida parol ishlatish", "2FA ni yoqish", "Shaxsiy ma'lumotlarni minimal oshkor etish"], "a": 0, "e": "Birinchi oltin qoida — xavfsiz tarmoq va brauzer, bu aynan trekerlarni bloklovchi kengaytmalarga tegishli."}, {"q": "Apparat kalit (FIDO2 / YubiKey) nima sababdan SMS-2FA dan ko'ra ishonchliroq?", "o": ["Chunki u internetsiz ishlaydi", "Chunki u SIM-Swap yoki tarmoq orqali masofadan o'g'irlab bo'lmaydigan fizik qurilma", "Chunki u arzonroq", "Chunki uni istalgan kishi ishlatishi mumkin"], "a": 1, "e": "Apparat kalit fizik qurilma bo'lgani uchun uni masofadan (SIM-swap, SS7 orqali) o'g'irlab bo'lmaydi."}, {"q": "STRIDE modelidagi «Information Disclosure» tahdidiga qarshi eng mos himoya chorasi qaysi?", "o": ["Rate limiting", "RBAC", "Ma'lumotlarni shifrlash va kirish nazorati", "Audit logging"], "a": 2, "e": "Maxfiy ma'lumotlar sizib chiqishiga qarshi shifrlash va qat'iy kirish nazorati asosiy himoya hisoblanadi."}, {"q": "CTF musobaqasida Base64 orqali kodlangan matnni ochish qaysi toifaga tegishli?", "o": ["Web Exploitation", "Reverse Engineering", "OSINT", "Cryptography"], "a": 3, "e": "Shifrlar va kodlashni ochish — Cryptography yo'nalishiga tegishli CTF topshirig'i."}, {"q": "Mijoz-Server arxitekturasida brauzeringiz veb-saytga so'rov yuborganda, bu qaysi tomon hisoblanadi?", "o": ["Mijoz (Client)", "Server", "Router", "Switch"], "a": 0, "e": "Xizmat yoki ma'lumot so'rovchi tomon — bu Mijoz (Client), masalan brauzer ishlatuvchi foydalanuvchi qurilmasi."}, {"q": "TCP/IP modelida HTTP, DNS kabi protokollar qaysi sathga tegishli?", "o": ["Internet (Tarmoq) sathi", "Tadbiqiy (Application) sathi", "Transport sathi", "Tarmoqqa kirish sathi"], "a": 1, "e": "HTTP, HTTPS, DNS, SSH, FTP kabi protokollar TCP/IP modelining Tadbiqiy (Application) sathida joylashgan."}, {"q": "Agar foydalanuvchi ochiq Wi-Fi da shifrlanmagan (HTTP) saytga kirsa va bir vaqtda raqamli gigiyena qoidalariga rioya qilmasa, bu qaysi darsda o'rganilgan hujumga ochiq bo'lib qoladi?", "o": ["Faqat Base64 kodlash hujumiga", "Faqat tarmoq topologiyasi muammosiga", "MITM / sniffing hujumiga (2-haftada o'rganilgan)", "Hech qanday hujumga ochiq emas"], "a": 2, "e": "Shifrlanmagan HTTP trafigi ochiq Wi-Fi da MITM/sniffing orqali osongina tutib olinishi mumkin — bu raqamli gigiyenaning HTTPS qoidasi bilan bog'liq."}, {"q": "Onlayn ta'lim platformasida test natijalari bazada o'zgartirib qo'yilsa, bu STRIDE ning qaysi toifasiga va qanday himoyaga mos keladi?", "o": ["Spoofing; 2FA kerak", "Denial of Service; rate limit kerak", "Repudiation; parolni o'zgartirish kerak", "Tampering; tranzaksiya xeshlari (ma'lumot yaxlitligini tekshirish) kerak"], "a": 3, "e": "Ma'lumotning ruxsatsiz o'zgartirilishi — Tampering, unga qarshi xesh orqali yaxlitlikni nazorat qilish qo'llaniladi."}, {"q": "Maktab tarmog'ida Yulduz (Star) topologiyasi ishlatilsa va markaziy Switch DDoS hujumiga uchrasa, natija nima bo'ladi?", "o": ["Butun tarmoqdagi barcha kompyuterlar aloqasiz qolishi mumkin", "Faqat bitta kompyuter ishlamay qoladi", "Tarmoq tezligi oshadi", "Hech qanday ta'sir bo'lmaydi"], "a": 0, "e": "Star topologiyasida markaziy Switch yagona zaif nuqta bo'lgani uchun unga qaratilgan hujum butun tarmoqqa ta'sir qiladi."}, {"q": "CTF musobaqalarida Red Team tajribasi qaysi ko'nikma bilan bevosita bog'liq?", "o": ["Faqat tarmoq kabellarini ulash", "Adversarial thinking — hujumchi kabi fikrlab zaifliklarni topish", "Faqat video darslarni ko'rish", "Faqat parol o'zgartirish"], "a": 1, "e": "Red Team real hujumchi kabi fikrlab (adversarial thinking) tizim zaifliklarini topadi — bu CTF da ham asosiy ko'nikma."}, {"q": "Telegramda 2FA yoqilgan, lekin foydalanuvchi ochiq Wi-Fi da HTTP orqali boshqa saytga kirsa, bu holatda qaysi xavf saqlanadi?", "o": ["Hech qanday xavf qolmaydi", "Telegram hisobi avtomatik o'chadi", "Boshqa (himoyalanmagan) saytdagi login ma'lumotlari MITM orqali tutib olinishi mumkin", "2FA bu holatda keraksiz bo'lib qoladi"], "a": 2, "e": "2FA faqat shu xizmatni himoyalaydi; boshqa shifrlanmagan saytlardagi ma'lumotlar baribir MITM xavfida qoladi."}, {"q": "OSI modelining Tadbiqiy (Application) sathida eng ko'p uchraydigan hujum turi (masalan, SQL Injection, XSS) nima uchun aynan shu sathga tegishli?", "o": ["Chunki bu sathda faqat kabel ishlatiladi", "Chunki bu sathda MAC manzil ishlatiladi", "Chunki bu sath faqat fizik qurilmalarga tegishli", "Chunki bu sathda foydalanuvchi va dastur bevosita o'zaro ishlaydi (veb-sayt, forma kiritish)"], "a": 3, "e": "Tadbiqiy sath foydalanuvchi va dastur o'rtasidagi bevosita muloqot joyi bo'lgani uchun SQL Injection va XSS kabi hujumlar shu yerda yuz beradi."}, {"q": "Agar kompaniya DAI (Dynamic ARP Inspection) qo'llamasa va Kanal sathida ARP Spoofing hujumi amalga oshsa, bu qaysi yuqoriroq sathdagi protokollarga ham ta'sir qiladi?", "o": ["Ha, chunki trafik hujumchi orqali o'tib, Tadbiqiy sathdagi HTTP so'rovlari ham o'qilishi/o'zgartirilishi mumkin", "Hech qanday ta'siri yo'q, faqat Kanal sathida qoladi", "Faqat Fizik sathga ta'sir qiladi", "Faqat printer ishlashiga ta'sir qiladi"], "a": 0, "e": "ARP Spoofing orqali trafik hujumchidan o'tgach, yuqori sathlardagi (HTTP, login ma'lumotlari) trafik ham xavf ostida qoladi — bu MITM mexanizmi."}, {"q": "Maktab elektron jurnali uchun STRIDE tahlili va tarmoq xavfsizligi (3-dars) bilimlarini birlashtirsak, jurnal serverining DoS hujumidan himoyasi uchun qaysi tarmoq darajasidagi chora foydali?", "o": ["Faqat parolni uzaytirish", "Rate limiting va yuklamani taqsimlash (load balancing)", "Faqat Base64 kodlash", "Tarmoq topologiyasini Bus ga o'zgartirish"], "a": 1, "e": "DoS ga qarshi tarmoq darajasida so'rovlar chastotasini cheklash va yukni taqsimlash samarali himoya beradi."}, {"q": "3-haftada o'rganilgan darslarning umumiy ketma-ketligi qanday edi?", "o": ["Avval tarmoq asoslari, keyin raqamli gigiyena, keyin STRIDE", "Faqat CIA va MITM takrorlandi", "Raqamli gigiyena va 2FA (7-dars), STRIDE/Red-Blue Team/CTF (8-dars), tarmoq asoslari (9-dars)", "Avval malware, keyin fishing mavzulari"], "a": 2, "e": "3-hafta: 7-dars raqamli gigiyena/2FA, 8-dars STRIDE va CTF, 9-dars tarmoq asoslari bilan yakunlandi."}, {"q": "Agar tashkilot «Assume Breach» tamoyiliga amal qilsa va STRIDE tahlilini birgalikda qo'llasa, bu qanday yondashuvni anglatadi?", "o": ["Faqat tashqi hujumlardan qo'rqish, ichki tarmoqqa ishonish", "Internetga umuman ulanmaslik", "Faqat parolni yodlash", "Ichki tarmoq ham xavf ostida deb faraz qilib, har bir tahdid toifasi bo'yicha oldindan himoya rejalashtirish"], "a": 3, "e": "Assume Breach va STRIDE birgalikda — ichki tarmoq xavfsiz emas deb hisoblab, har bir tahdid toifasiga oldindan tayyor bo'lish strategiyasini beradi."}, {"q": "TCP 3-Way Handshake va DAI (Dynamic ARP Inspection) ning umumiy maqsadi nimada o'xshaydi?", "o": ["Ikkalasi ham tarmoqda ishonchli aloqa o'rnatish/tekshirish jarayonini ta'minlaydi", "Ikkalasi ham fayllarni shifrlaydi", "Ikkalasi ham faqat video oqim uchun", "Ular bir-biriga mutlaqo aloqasiz"], "a": 0, "e": "TCP handshake ishonchli ulanish o'rnatadi, DAI esa ARP javoblarining haqiqiyligini tekshiradi — ikkalasi ham tarmoqda ishonchni ta'minlashga xizmat qiladi."}, {"q": "Agar maktab Wi-Fi tarmog'ida 2FA, DoH va to'g'ri sozlangan tarmoq topologiyasi (Star + DAI) birgalikda qo'llansa, bu qaysi darslardagi bilimlarni birlashtirgan bo'ladi?", "o": ["Faqat 9-dars", "7-dars (raqamli gigiyena/2FA/DoH) va 9-dars (tarmoq topologiyasi/DAI) bilimlarini", "Faqat 8-dars", "Bu darslar bir-biriga aloqasi yo'q"], "a": 1, "e": "Bu yondashuv 7-darsdagi foydalanuvchi xavfsizligi choralarini va 9-darsdagi tarmoq arxitekturasi himoyasini birgalikda qo'llaydi."}, {"q": "CTF musobaqasida ishtirokchi STRIDE bilimidan qanday foydalanishi mumkin?", "o": ["STRIDE CTF ga umuman aloqasi yo'q", "Faqat Base64 ni dekodlash uchun", "Berilgan tizimda qanday tahdid toifalari (Spoofing, Tampering va h.k.) borligini aniqlab, zaiflikni tezroq topish uchun", "Faqat parolni yodlash uchun"], "a": 2, "e": "STRIDE tizimli tahdid toifalarini beradi, bu CTF ishtirokchisiga qaysi turdagi zaiflikni izlash kerakligini tezroq aniqlashga yordam beradi."}, {"q": "3-hafta materiallarining umumiy maqsadi nimada edi?", "o": ["Faqat tarmoq kabellarini ulashni o'rgatish", "Faqat CTF musobaqasida qatnashishni o'rgatish", "Faqat parollarni yodlashni o'rgatish", "Foydalanuvchi darajasidagi xavfsizlik odatlarini, tahdidlarni tizimli tahlil qilishni va tarmoqning texnik asoslarini birlashtirish"], "a": 3, "e": "3-hafta raqamli gigiyena (foydalanuvchi darajasi), STRIDE/Red-Blue Team (tizimli tahlil) va tarmoq asoslari (texnik poydevor) ni birlashtirdi."}]</script>
<script>
(function(){
var Q=JSON.parse(document.getElementById('qdata').textContent),i=0,score=0,wrong=[],done=false;
var $=function(s){return document.querySelector(s)},card=$('#card'),next=$('#next');
function esc(t){return t}
function show(){
  var q=Q[i];done=false;
  $('#cnt').textContent='Savol '+(i+1)+' / '+Q.length;$('#sc').textContent='To\u2018g\u2018ri: '+score;
  $('#fill').style.width=(i/Q.length*100)+'%';
  var h='<p class="q">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,k){h+='<button class="opt" type="button" data-k="'+k+'"><b>'+'ABCDEFGH'[k]+'</b><span>'+o+'</span></button>'});
  h+='</div><div class="explain" id="ex"></div>';card.innerHTML=h;
  next.textContent=i==Q.length-1?'Natijani ko\u2018rish':'Keyingi savol';next.disabled=true;
  card.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){pick(+b.dataset.k)})});
  window.scrollTo(0,0);
}
function pick(k){
  if(done)return;done=true;var q=Q[i],bs=card.querySelectorAll('.opt');
  bs.forEach(function(b,j){b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  if(k==q.a)score++;else wrong.push({q:q.q,y:q.o[k],c:q.o[q.a]});
  var ex=$('#ex');ex.innerHTML=(k==q.a?'<b>To\u2018g\u2018ri!</b> ':'<b>Noto\u2018g\u2018ri.</b> ')+(q.e||'');ex.classList.add('show');
  $('#sc').textContent='To\u2018g\u2018ri: '+score;next.disabled=false;
  ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  var p=Math.round(score/Q.length*100);
  $('#fill').style.width='100%';$('#cnt').textContent='Natija';
  var msg=p>=90?'Ajoyib!':p>=70?'Yaxshi natija!':p>=50?'Yomon emas, takrorlab ko\u2018ring.':'Mavzuni qayta o\u2018qib chiqing.';
  var h='<div class="res"><div class="n">'+score+' / '+Q.length+'</div><div>'+p+'% \u2014 '+msg+'</div></div>';
  if(wrong.length){h+='<h3>Xatolar tahlili</h3><div class="rev">';wrong.forEach(function(w){h+='<div><b>'+w.q+'</b><br><small>Sizning javobingiz: '+w.y+'</small><br>To\u2018g\u2018ri javob: '+w.c+'</div>'});h+='</div>'}
  card.innerHTML=h;next.textContent='Qayta urinish';next.disabled=false;next.onclick=function(){i=0;score=0;wrong=[];next.onclick=adv;show()};
  window.scrollTo(0,0);
}
function adv(){if(i<Q.length-1){i++;show()}else finish()}
next.onclick=adv;
document.addEventListener('keydown',function(e){
  var n=parseInt(e.key,10);if(n>=1&&n<=Q[i].o.length&&!done&&card.querySelector('.opt'))pick(n-1);
  else if((e.key=='Enter'||e.key==' ')&&!next.disabled&&document.activeElement.tagName!='BUTTON'){e.preventDefault();next.onclick()}
});
show();
})();
</script>
</body>
</html>
