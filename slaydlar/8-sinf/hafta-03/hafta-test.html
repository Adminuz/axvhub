<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>3-hafta testi</title>
<link rel="icon" href="../../../reveal/logo.png">
<script src="../../../reveal/tema.js"></script>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--mut:#667;--card:#f4f5f7;--bd:#d5d8de;--ac:#2a6df4;--ok:#1a8f4a;--okbg:#e3f6ea;--no:#c62828;--nobg:#fdeaea}
[data-theme=dark]{--bg:#1e1e1e;--fg:#eee;--mut:#9aa;--card:#2a2b2e;--bd:#44464b;--ac:#5b9bff;--ok:#4cc77f;--okbg:#17321f;--no:#ff7b72;--nobg:#3a1c1c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:40px;height:40px;object-fit:contain}
h1{font-size:1.15rem;line-height:1.3;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:8px 0 14px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:8px;display:none}
.explain.show{display:block}
code{font-family:ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:.92em}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
.foot div{max-width:720px;margin:0 auto}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding:12px 0}.res .n{font-size:3rem;font-weight:700}
.rev{margin-top:16px;display:grid;gap:10px;text-align:left}
.rev div{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.rev small{color:var(--mut)}
.theme-toggle{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:0;display:grid;place-items:center;z-index:5;cursor:pointer}.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
header{padding-right:48px}.opt{-webkit-tap-highlight-color:transparent;user-select:none}
@media(min-width:700px){body{font-size:18px}.wrap{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="../../../reveal/logo.png" alt="AXV"><h1>3-hafta testi</h1></header>
<div class="badges"><span class="badge">8-sinf</span><span class="badge">Web Full-stack</span><span class="badge">3-hafta</span><span class="badge">20 ta savol &amp;middot; taxminan 18 daqiqa</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<main id="card"></main>
</div>
<div class="foot"><div><button class="btn" id="next" type="button" disabled>Keyingi savol</button></div></div>
<script type="application/json" id="qdata">[{"q": "Mustaqil blok sifatida boshqa saytga ko'chirilganda ham ma'nosini yo'qotmaydigan mazmun qaysi tegga mos?", "o": ["<code>&lt;article&gt;<\/code>", "<code>&lt;nav&gt;<\/code>", "<code>&lt;footer&gt;<\/code>", "<code>&lt;aside&gt;<\/code>"], "a": 0, "e": "Blog posti, yangilik, mahsulot kartochkasi, sharh — <code>article<\/code>."}, {"q": "<code>&lt;main&gt;<\/code> qayerda joylashishi mumkin emas?", "o": ["<code>&lt;body&gt;<\/code> ichida", "<code>&lt;footer&gt;<\/code> ichida", "<code>&lt;header&gt;<\/code> va <code>&lt;footer&gt;<\/code> orasida", "<code>&lt;html&gt;<\/code> ichida, <code>&lt;body&gt;<\/code> ning bolasi sifatida"], "a": 1, "e": "<code>main<\/code> <code>header<\/code>, <code>footer<\/code> yoki <code>aside<\/code> ichida turmaydi."}, {"q": "HTML4 davrida veb-sahifa bloklari qaysi teg bilan yasalgan?", "o": ["<code>&lt;article&gt;<\/code> bilan", "<code>&lt;main&gt;<\/code> bilan", "Faqat <code>&lt;div&gt;<\/code> bilan", "<code>&lt;aside&gt;<\/code> bilan"], "a": 2, "e": "HTML5 da <code>div<\/code> o'rniga mazmunli semantik teglar paydo bo'ldi."}, {"q": "Har bir <code>&lt;article&gt;<\/code> ichida o'zining kichik <code>&lt;header&gt;<\/code>i bo'lishi mumkinmi?", "o": ["Yo'q, <code>header<\/code> faqat bitta", "Faqat <code>&lt;footer&gt;<\/code> ichida", "Faqat <code>&lt;aside&gt;<\/code> da", "Ha, mumkin"], "a": 3, "e": "<code>header<\/code> sahifada ham, bo'lim va maqolada ham bo'lishi mumkin."}, {"q": "Blog sahifasi skeletida <code>main<\/code> ichida nima turadi?", "o": ["Maqolalar (<code>article<\/code>) va yon panel (<code>aside<\/code>)", "Faqat <code>footer<\/code>", "Sayt menyusi <code>nav<\/code> (sahifa bosh qismi)", "<code>&lt;!DOCTYPE&gt;<\/code>"], "a": 0, "e": "Header va footer <code>main<\/code> dan tashqarida, asosiy kontent esa <code>main<\/code> ichida."}, {"q": "Reklama bannerlari yoki o'xshash maqolalar ro'yxati odatda qaysi tegga o'raladi?", "o": ["<code>&lt;main&gt;<\/code>", "<code>&lt;aside&gt;<\/code>", "<code>&lt;header&gt;<\/code>", "<code>&lt;title&gt;<\/code>"], "a": 1, "e": "<code>aside<\/code> — qo'shimcha yon panel."}, {"q": "HTML5 gacha videoni ko'rsatish uchun nima kerak edi?", "o": ["Hech narsa kerak emas edi", "Faqat <code>&lt;img&gt;<\/code>", "Uchinchi tomon plagini (masalan, Flash Player)", "Faqat CSS"], "a": 2, "e": "HTML5 da video va audio brauzerning o'zida plaginlarsiz ishlaydi."}, {"q": "<code>&lt;source&gt;<\/code> tegi <code>&lt;video&gt;<\/code> ichida nima uchun bir nechta yoziladi?", "o": ["Videoni takrorlash uchun", "Sarlavha yozish uchun", "Videoni yashirish uchun", "Turli formatlar (mp4, webm) berish uchun"], "a": 3, "e": "Brauzer qo'llab-quvvatlaydigan formatni tanlaydi."}, {"q": "<code>&lt;figure&gt;<\/code> ning <code>&lt;img&gt;<\/code> dan farqi nima?", "o": ["Rasm va uning izohini bitta semantik blokka birlashtiradi", "Rasmni kattalashtiradi", "Faqat video uchun", "Rasmning manzilini beradi"], "a": 0, "e": "<code>figcaption<\/code> izoh bo'lib, <code>figure<\/code> bilan bog'liq bo'ladi."}, {"q": "<code>&lt;mark&gt;<\/code> teg matnni qanday ajratadi?", "o": ["Pastki indeks bilan", "Sariq fon bilan", "Rasm bilan", "Havola qiladi"], "a": 1, "e": "<code>mark<\/code> qidirilgan yoki e'tibor qaratilishi kerak bo'lgan so'zni ajratadi."}, {"q": "<code>&lt;progress value=\"70\" max=\"100\"&gt;<\/code> da <code>max<\/code> nimani bildiradi?", "o": ["Minimal qiymat", "Qiymatning rangi", "Eng katta qiymat, ya'ni to'liq holat", "Ovoz balandligi"], "a": 2, "e": "<code>value<\/code> joriy, <code>max<\/code> esa 100% ga to'g'ri keladigan qiymat."}, {"q": "<code>title<\/code> global atributi nima qiladi?", "o": ["Sahifa nomini o'zgartiradi", "Elementni yashiradi", "Elementni tahrirlanadigan qiladi", "Kursor element ustida turganda kichik izoh chiqaradi"], "a": 3, "e": "<code>title<\/code> — tooltip."}, {"q": "<code>class<\/code> atributiga «btn katta» deb yozildi (bo'sh joy bilan). Nechta sinf berilgan?", "o": ["Ikkita", "Bitta", "Nol", "Uchta"], "a": 0, "e": "Sinf nomlari bo'sh joy bilan ajratiladi."}, {"q": "Quyidagilardan qaysi biri <code>data-*<\/code> atributiga misol?", "o": ["<code>datauser=\"77\"<\/code>", "<code>data-user-id=\"77\"<\/code>", "<code>user-data=\"77\"<\/code>", "<code>data_id<\/code>"], "a": 1, "e": "Nomi <code>data-<\/code> bilan boshlanadi, davomiga istalgan so'z yoziladi."}, {"q": "<code>type=\"date\"<\/code> nima ochadi?", "o": ["Rang palitrasini", "Slayderni", "Kalendardan sana tanlash oynasini", "Fayl tanlashni"], "a": 2, "e": "<code>date<\/code> sana, <code>color<\/code> rang, <code>range<\/code> slayder."}, {"q": "<code>&lt;h2 contenteditable=\"true\"&gt;<\/code> yozilsa, foydalanuvchi nima qila oladi?", "o": ["Sarlavhani yashira oladi", "Sarlavhani rasmga aylantira oladi", "Hech narsa o'zgarmaydi", "Sarlavha matnini brauzerda o'chirib, o'zgartira oladi"], "a": 3, "e": "Atribut matnni Word'dagi kabi to'g'ridan-to'g'ri tahrirlashga imkon beradi."}, {"q": "I bob yakuniy loyihasi «Interaktiv portfolio» uchun sahifaning asosiy bo'limlari qaysi teglar bilan tuziladi?", "o": ["<code>header<\/code>, <code>nav<\/code>, <code>main<\/code>, <code>section<\/code>, <code>footer<\/code>", "Faqat <code>div<\/code>", "Faqat <code>table<\/code>", "Faqat <code>form<\/code>"], "a": 0, "e": "Semantik tuzilma loyihaning skeleti bo'ladi."}, {"q": "Portfoliodagi «Mening ko'nikmalarim» jadvali va savol-javoblar qaysi teglar bilan beriladi?", "o": ["<code>ul<\/code> va <code>audio<\/code>", "<code>table<\/code> va <code>details<\/code>/<code>summary<\/code>", "<code>meter<\/code> va <code>form<\/code>", "<code>nav<\/code> va <code>video<\/code>"], "a": 1, "e": "Jadval — 5-dars, <code>details<\/code> — 8-dars mavzusi."}, {"q": "Portfolioda bog'lanish formasida rang tanlash va sana kerak. Qaysi <code>input<\/code> turlari?", "o": ["<code>radio<\/code> va <code>file<\/code>", "<code>password<\/code> va <code>range<\/code>", "<code>color<\/code> va <code>date<\/code>", "<code>submit<\/code> va <code>reset<\/code>"], "a": 2, "e": "Rang va sana uchun HTML5 ning yangi <code>input<\/code> turlari ishlatiladi."}, {"q": "Yon panelda foydalanuvchi kartochkasi bor, unga <code>data-status=\"active\"<\/code> berilgan. Bu nima uchun kerak?", "o": ["Elementni yashirish uchun", "Rasm qo'yish uchun", "Havola yasash uchun", "Elementga ma'lumotni HTML ichida biriktirish uchun"], "a": 3, "e": "<code>data-*<\/code> HTML ichida shaxsiy ma'lumotlarni saqlaydi, <code>aside<\/code> esa yon panel ma'nosini beradi."}]</script>
<script>
(function(){
var Q=JSON.parse(document.getElementById('qdata').textContent),i=0,score=0,wrong=[],done=false;
var $=function(s){return document.querySelector(s)},card=$('#card'),next=$('#next');
function esc(t){return t}
function show(){
  var q=Q[i];done=false;
  $('#cnt').textContent='Savol '+(i+1)+' / '+Q.length;$('#sc').textContent='To\u2018g\u2018ri: '+score;
  $('#fill').style.width=(i/Q.length*100)+'%';
  var h='<p class="q">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,k){h+='<button class="opt" type="button" data-k="'+k+'"><b>'+'ABCDEFGH'[k]+'</b><span>'+o+'</span></button>'});
  h+='</div><div class="explain" id="ex"></div>';card.innerHTML=h;
  next.textContent=i==Q.length-1?'Natijani ko\u2018rish':'Keyingi savol';next.disabled=true;
  card.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){pick(+b.dataset.k)})});
  window.scrollTo(0,0);
}
function pick(k){
  if(done)return;done=true;var q=Q[i],bs=card.querySelectorAll('.opt');
  bs.forEach(function(b,j){b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  if(k==q.a)score++;else wrong.push({q:q.q,y:q.o[k],c:q.o[q.a]});
  var ex=$('#ex');ex.innerHTML=(k==q.a?'<b>To\u2018g\u2018ri!</b> ':'<b>Noto\u2018g\u2018ri.</b> ')+(q.e||'');ex.classList.add('show');
  $('#sc').textContent='To\u2018g\u2018ri: '+score;next.disabled=false;
  ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  var p=Math.round(score/Q.length*100);
  $('#fill').style.width='100%';$('#cnt').textContent='Natija';
  var msg=p>=90?'Ajoyib!':p>=70?'Yaxshi natija!':p>=50?'Yomon emas, takrorlab ko\u2018ring.':'Mavzuni qayta o\u2018qib chiqing.';
  var h='<div class="res"><div class="n">'+score+' / '+Q.length+'</div><div>'+p+'% \u2014 '+msg+'</div></div>';
  if(wrong.length){h+='<h3>Xatolar tahlili</h3><div class="rev">';wrong.forEach(function(w){h+='<div><b>'+w.q+'</b><br><small>Sizning javobingiz: '+w.y+'</small><br>To\u2018g\u2018ri javob: '+w.c+'</div>'});h+='</div>'}
  card.innerHTML=h;next.textContent='Qayta urinish';next.disabled=false;next.onclick=function(){i=0;score=0;wrong=[];next.onclick=adv;show()};
  window.scrollTo(0,0);
}
function adv(){if(i<Q.length-1){i++;show()}else finish()}
next.onclick=adv;
document.addEventListener('keydown',function(e){
  var n=parseInt(e.key,10);if(n>=1&&n<=Q[i].o.length&&!done&&card.querySelector('.opt'))pick(n-1);
  else if((e.key=='Enter'||e.key==' ')&&!next.disabled&&document.activeElement.tagName!='BUTTON'){e.preventDefault();next.onclick()}
});
show();
})();
</script>
</body>
</html>
