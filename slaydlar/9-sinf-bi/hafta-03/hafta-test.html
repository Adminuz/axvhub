<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>3-hafta testi</title>
<link rel="icon" href="../../../reveal/logo.png">
<script src="../../../reveal/tema.js"></script>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--mut:#667;--card:#f4f5f7;--bd:#d5d8de;--ac:#2a6df4;--ok:#1a8f4a;--okbg:#e3f6ea;--no:#c62828;--nobg:#fdeaea}
[data-theme=dark]{--bg:#1e1e1e;--fg:#eee;--mut:#9aa;--card:#2a2b2e;--bd:#44464b;--ac:#5b9bff;--ok:#4cc77f;--okbg:#17321f;--no:#ff7b72;--nobg:#3a1c1c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:40px;height:40px;object-fit:contain}
h1{font-size:1.15rem;line-height:1.3;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:8px 0 14px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:8px;display:none}
.explain.show{display:block}
code{font-family:ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:.92em}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
.foot div{max-width:720px;margin:0 auto}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:not-allowed}
.res{text-align:center;padding:12px 0}.res .n{font-size:3rem;font-weight:700}
.cd-box{margin:14px 0;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);text-align:center;line-height:1.4}
.rev{margin-top:16px;display:grid;gap:10px;text-align:left}
.rev div{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.rev small{color:var(--mut)}
.theme-toggle{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:0;display:grid;place-items:center;z-index:5;cursor:pointer}.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
header{padding-right:48px}.opt{-webkit-tap-highlight-color:transparent;user-select:none}
@media(min-width:700px){body{font-size:18px}.wrap{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="../../../reveal/logo.png" alt="AXV"><h1>3-hafta testi</h1></header>
<div class="badges"><span class="badge">9-sinf</span><span class="badge">Business Intelligence</span><span class="badge">3-hafta</span><span class="badge">20 ta savol &amp;middot; taxminan 18 daqiqa</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<main id="card"></main>
</div>
<div class="foot"><div><button class="btn" id="next" type="button" disabled>Keyingi savol</button></div></div>
<script type="application/json" id="qdata">[{"q": "Tahlilchilar ish vaqtining qanchasini odatda ma'lumotlarni tozalashga sarflaydi?", "o": ["Taxminan 70-80 foizini", "Taxminan 5 foizini", "Hech qancha", "Taxminan 10 foizini"], "a": 0, "e": "Tozalash tahlilchi ishining eng katta qismi."}, {"q": "<code>UPPER<\/code> funksiyasi nima qiladi?", "o": ["Barcha harflarni kichik qiladi", "Barcha harflarni katta qiladi", "Faqat birinchi harfni katta qiladi", "Bo'shliqlarni olib tashlaydi"], "a": 1, "e": "<code>UPPER<\/code> va <code>LOWER<\/code> registrni to'liq o'zgartiradi."}, {"q": "Aynan takrorlangan yozuvlarni bir zumda tozalovchi Excel vositasi qaysi?", "o": ["Flash Fill", "Slicer", "Remove Duplicates", "Timeline"], "a": 2, "e": "Remove Duplicates takroriy qatorlarni olib tashlaydi."}, {"q": "Power Query nima uchun mo'ljallangan?", "o": ["Faqat ranglash uchun", "Faqat chop etish uchun", "Faqat formulalarni yashirish uchun", "Ma'lumotlarni yig'ish, tozalash va o'zgartirish (ETL) uchun"], "a": 3, "e": "Power Query ETL platformasi sifatida ishlaydi."}, {"q": "«901234567» ni «(90) 123-45-67» ko'rinishiga keltirish uchun qaysi vosita qulay?", "o": ["Flash Fill", "Slicer", "Refresh", "Junction Table"], "a": 0, "e": "Bir namunani qo'lda yozib <code>Ctrl + E<\/code> bosish kifoya."}, {"q": "<code>TRIM<\/code> «Ali    Vali» (ko'p probel) matniga qo'llansa, natija qanday?", "o": ["«AliVali»", "«Ali Vali»", "«ALI VALI»", "«Ali    Vali» o'zgarmaydi"], "a": 1, "e": "So'zlar orasida bittadan boshqa barcha ortiqcha bo'shliqlar olib tashlanadi."}, {"q": "PivotTable da Rows maydoni nimani belgilaydi?", "o": ["Hisoblanadigan sonni", "Faqat sanalarni", "Qaysi toifalar bo'yicha guruhlashni", "Faqat rangni"], "a": 2, "e": "Masalan, Viloyat yoki Mahsulot Rows ga qo'yiladi."}, {"q": "PivotTable ni yaratish uchun qaysi menyu tanlanadi?", "o": ["<code>Data &gt; Refresh All<\/code> faqat", "<code>Home &gt; Wrap Text<\/code>", "<code>View &gt; Zoom<\/code>", "<code>Insert &gt; PivotTable<\/code>"], "a": 3, "e": "Jadvaldagi katakni bosib <code>Insert &gt; PivotTable<\/code> tanlanadi."}, {"q": "Qiymatlar yig'indisi o'rniga o'rtachasini ko'rish uchun nima o'zgartiriladi?", "o": ["Value Field Settings da hisoblash turi", "Slicer rangi", "Timeline sanasi", "Primary Key"], "a": 0, "e": "Value Field Settings da Sum, Average, Count, Max, Min tanlanadi."}, {"q": "Butun hisobotni bitta parametr (masalan, yil) bo'yicha global filtrlash uchun qaysi maydon ishlatiladi?", "o": ["Values", "Filters", "Columns", "Rows emas, hech qaysi"], "a": 1, "e": "Filters maydoni butun hisobotni bitta parametr bo'yicha saralaydi."}, {"q": "Bitta Slicer bir nechta PivotTable va diagrammani qanday boshqarishi mumkin?", "o": ["Hech qachon boshqara olmaydi", "Faqat Merge qilib", "Report Connections orqali ulab", "Faqat Text-to-Columns bilan"], "a": 2, "e": "Bitta tugma bosilsa, ulangan barcha jadval va diagrammalar mos o'zgaradi."}, {"q": "Pivot jadvalning formulalardan asosiy afzalligi nima?", "o": ["Faqat 10 qatorda ishlaydi", "Har safar o'nlab <code>SUMIFS<\/code> yozish kerak", "Faqat matn bilan ishlaydi", "Formulasiz, sichqoncha bilan bir necha soniyada hisobot tayyorlanadi"], "a": 3, "e": "10 000 qatorli ma'lumot ham bir necha harakatda umumlashtiriladi."}, {"q": "Pasport seriyasi qaysi turdagi kalitga misol?", "o": ["Natural Key (tabiiy kalit)", "Surrogate Key", "Foreign Key emas, hech qanday kalit", "Junction Table"], "a": 0, "e": "Haqiqiy hayotdan olingan noyob ma'lumot tabiiy kalit."}, {"q": "Excel bitta varaqda nechta qatorni qabul qiladi va bu nega baza uchun kam?", "o": ["10 000 ta; yetarli", "1 048 576 ta; yirik tizimlarda millionlab tranzaksiya bor", "100 ta; yetarli", "Cheksiz; muammo yo'q"], "a": 1, "e": "RDBMS milliardlab qatorlar bilan ishlay oladi."}, {"q": "Bitta fuqaroga faqat bitta xorijiy pasport. Bu qaysi munosabat?", "o": ["1:N", "M:N", "1:1", "Munosabat yo'q"], "a": 2, "e": "Har ikki tomonda faqat bittadan yozuv bo'lsa, 1:1."}, {"q": "Qaysi biri RDBMS (relatsion DBMS) misoli?", "o": ["Flash Fill", "PivotChart", "Slicer", "PostgreSQL"], "a": 3, "e": "PostgreSQL, MySQL va SQL Server relatsion DBMS lardir."}, {"q": "Relatsion modelda Column (ustun) boshqacha qanday ataladi?", "o": ["Attribute (xususiyat, maydon)", "Tuple (yozuv)", "Relation (jadval)", "Junction"], "a": 0, "e": "Ustun ob'ektning xususiyati (<code>Ism<\/code>, <code>Yoshi<\/code>, <code>Telefon<\/code>), satr esa Tuple."}, {"q": "Pivot natijasida «Toshkent» va «Toshkent » alohida guruh bo'ldi. Sabab va yechim qaysi?", "o": ["PivotTable buzilgan; uni o'chirish", "Ortiqcha probel; <code>TRIM<\/code> bilan tozalab, Refresh qilish", "Slicer ishlamayapti; uni yopish", "Primary Key takrorlangan; uni o'chirish"], "a": 1, "e": "Ko'rinmas probel yozuvlarni turlicha qiladi, tozalagach Refresh kerak."}, {"q": "Tidy Data dagi «har bir qator bitta kuzatuv» bazada qaysi tushunchaga mos?", "o": ["Column (ustun)", "Foreign Key", "Row (satr, yozuv)", "Junction Table"], "a": 2, "e": "Bazada bitta kuzatuv bitta satr (Record) bo'ladi."}, {"q": "Hisobotgacha to'g'ri ketma-ketlik qaysi?", "o": ["Slicer, PivotTable, tozalash, Excel Table", "PivotTable, tozalash, Slicer, Excel Table", "Excel Table, Slicer, PivotTable, tozalash", "Power Query bilan tozalash, Excel Table, PivotTable, Slicer"], "a": 3, "e": "Avval ma'lumot tozalanadi va tartiblanadi, keyin umumlashtirilib, interaktiv filtr qo'shiladi."}]</script>
<script>
(function(){
var RAW=JSON.parse(document.getElementById('qdata').textContent);
var Q=[],i=0,score=0,wrong=[],done=false;
var $=function(s){return document.querySelector(s)},card=$('#card'),next=$('#next');
var storageKey='quiz_cd_'+location.pathname;
var timerId=null;

function shuffle(arr){
  var a=arr.slice();
  for(var j=a.length-1;j>0;j--){
    var k=Math.floor(Math.random()*(j+1));
    var tmp=a[j];a[j]=a[k];a[k]=tmp;
  }
  return a;
}

function initQuizData(){
  var shuffledQs=shuffle(RAW);
  Q=shuffledQs.map(function(item){
    var indexed=item.o.map(function(txt,idx){
      return {t:txt,c:idx===item.a};
    });
    var shuffledOpts=shuffle(indexed);
    var correctIdx=0;
    for(var o=0;o<shuffledOpts.length;o++){
      if(shuffledOpts[o].c){correctIdx=o;break;}
    }
    return {
      q:item.q,
      o:shuffledOpts.map(function(o){return o.t;}),
      a:correctIdx,
      e:item.e
    };
  });
  i=0;score=0;wrong=[];done=false;
}

function show(){
  var q=Q[i];done=false;
  $('#cnt').textContent='Savol '+(i+1)+' / '+Q.length;$('#sc').textContent='To\u2018g\u2018ri: '+score;
  $('#fill').style.width=(i/Q.length*100)+'%';
  var h='<p class="q">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,k){h+='<button class="opt" type="button" data-k="'+k+'"><b>'+'ABCDEFGH'[k]+'</b><span>'+o+'</span></button>'});
  h+='</div><div class="explain" id="ex"></div>';card.innerHTML=h;
  next.textContent=i==Q.length-1?'Natijani ko\u2018rish':'Keyingi savol';next.disabled=true;
  card.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){pick(+b.dataset.k)})});
  window.scrollTo(0,0);
}

function pick(k){
  if(done)return;done=true;var q=Q[i],bs=card.querySelectorAll('.opt');
  bs.forEach(function(b,j){b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  if(k==q.a)score++;else wrong.push({q:q.q,y:q.o[k],c:q.o[q.a]});
  var ex=$('#ex');ex.innerHTML=(k==q.a?'<b>To\u2018g\u2018ri!</b> ':'<b>Noto\u2018g\u2018ri.</b> ')+(q.e||'');ex.classList.add('show');
  $('#sc').textContent='To\u2018g\u2018ri: '+score;next.disabled=false;
  ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function finish(){
  var p=Math.round(score/Q.length*100);
  $('#fill').style.width='100%';$('#cnt').textContent='Natija';
  var msg=p>=90?'Ajoyib!':p>=70?'Yaxshi natija!':p>=50?'Yomon emas, takrorlab ko\u2018ring.':'Mavzuni qayta o\u2018qib chiqing.';
  var h='<div class="res"><div class="n">'+score+' / '+Q.length+'</div><div>'+p+'% \u2014 '+msg+'</div></div>';
  h+='<div id="cd-box" class="cd-box"></div>';
  if(wrong.length){h+='<h3>Xatolar tahlili</h3><div class="rev">';wrong.forEach(function(w){h+='<div><b>'+w.q+'</b><br><small>Sizning javobingiz: '+w.y+'</small><br>To\u2018g\u2018ri javob: '+w.c+'</div>'});h+='</div>'}
  card.innerHTML=h;
  
  // 3 daqiqalik cooldown taymer (180s)
  var expiresAt=Date.now()+180000;
  localStorage.setItem(storageKey,expiresAt.toString());
  runCooldown();
  window.scrollTo(0,0);
}

function runCooldown(){
  if(timerId)clearInterval(timerId);
  function tick(){
    var stored=localStorage.getItem(storageKey);
    var exp=stored?parseInt(stored,10):0;
    var rem=Math.ceil((exp-Date.now())/1000);
    var cdBox=$('#cd-box');
    if(rem>0){
      next.disabled=true;
      var m=Math.floor(rem/60),s=rem%60;
      var ts=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
      next.textContent='Qayta urinish ('+ts+')';
      if(cdBox)cdBox.innerHTML='⏳ <b>Qayta urinish uchun kuting: '+ts+'</b><br><small style="color:var(--mut)">Shu vaqt ichida xatolaringizni tahlil qiling va mavzuni qayta o‘rganing.</small>';
    }else{
      if(timerId)clearInterval(timerId);
      localStorage.removeItem(storageKey);
      next.disabled=false;
      next.textContent='Qayta urinish';
      if(cdBox)cdBox.innerHTML='✅ <b>Qayta topshirishga ruxsat berildi!</b>';
      next.onclick=function(){
        initQuizData();
        next.onclick=adv;
        show();
      };
    }
  }
  tick();
  timerId=setInterval(tick,1000);
}

function adv(){if(i<Q.length-1){i++;show()}else finish()}
next.onclick=adv;

document.addEventListener('keydown',function(e){
  if(i>=Q.length||!Q[i])return;
  var n=parseInt(e.key,10);if(n>=1&&n<=Q[i].o.length&&!done&&card.querySelector('.opt'))pick(n-1);
  else if((e.key=='Enter'||e.key==' ')&&!next.disabled&&document.activeElement.tagName!='BUTTON'){e.preventDefault();next.onclick()}
});

initQuizData();
show();
})();
</script>
</body>
</html>
