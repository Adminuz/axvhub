<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>2-hafta testi</title>
<link rel="icon" href="../../../reveal/logo.png">
<script src="../../../reveal/tema.js"></script>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--mut:#667;--card:#f4f5f7;--bd:#d5d8de;--ac:#2a6df4;--ok:#1a8f4a;--okbg:#e3f6ea;--no:#c62828;--nobg:#fdeaea}
[data-theme=dark]{--bg:#1e1e1e;--fg:#eee;--mut:#9aa;--card:#2a2b2e;--bd:#44464b;--ac:#5b9bff;--ok:#4cc77f;--okbg:#17321f;--no:#ff7b72;--nobg:#3a1c1c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:40px;height:40px;object-fit:contain}
h1{font-size:1.15rem;line-height:1.3;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:8px 0 14px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:8px;display:none}
.explain.show{display:block}
code{font-family:ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:.92em}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
.foot div{max-width:720px;margin:0 auto}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding:12px 0}.res .n{font-size:3rem;font-weight:700}
.rev{margin-top:16px;display:grid;gap:10px;text-align:left}
.rev div{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.rev small{color:var(--mut)}
.theme-toggle{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:0;display:grid;place-items:center;z-index:5;cursor:pointer}.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
header{padding-right:48px}.opt{-webkit-tap-highlight-color:transparent;user-select:none}
@media(min-width:700px){body{font-size:18px}.wrap{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="../../../reveal/logo.png" alt="AXV"><h1>2-hafta testi</h1></header>
<div class="badges"><span class="badge">9-sinf</span><span class="badge">Android dasturlash</span><span class="badge">2-hafta</span><span class="badge">20 ta savol &amp;middot; taxminan 18 daqiqa</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<main id="card"></main>
</div>
<div class="foot"><div><button class="btn" id="next" type="button" disabled>Keyingi savol</button></div></div>
<script type="application/json" id="qdata">[{"q": "GMS tarkibiga qaysi dasturlar kiradi?", "o": ["Play Store, Maps, Gmail, YouTube, Play Services", "Linux yadrosi va ART", "Faqat kalkulyator va soat", "Faqat Huawei AppGallery"], "a": 0, "e": "Linux yadrosi va ART esa AOSP tarkibida."}, {"q": "AOSP tarkibiga nima kiradi?", "o": ["Google Play Store va Gmail", "Linux yadrosi, tizim kutubxonalari, ART va asosiy baza ilovalar", "Faqat Google Maps", "Firebase konsoli"], "a": 1, "e": "Baza ilovalarga oddiy kalkulyator, xabarlar va brauzer kiradi."}, {"q": "Google Play Services foydalanuvchi uchun qanday ko'rinadi?", "o": ["Asosiy ekrandagi katta o'yin", "Faqat sozlamalardagi tugma", "Interfeysi yo'q, orqa fonda ishlaydigan tizimli platforma", "Faqat reklama ilovasi"], "a": 2, "e": "Uning vazifasi ilovalarga xizmat ko'rsatish, ekranda chizish emas."}, {"q": "Nima uchun barcha ilovalar uchun bitta umumiy FCM kanali ishlatiladi?", "o": ["Ilovalar bir-biriga ulanishi uchun", "Internet narxi arzonlashishi uchun", "Reklama ko'proq chiqishi uchun", "Har bir ilova o'z serveriga alohida ulanganda batareya tez tugaydi"], "a": 3, "e": "Bitta shifrlangan kanal batareyani tejaydi va xabarlarni tegishli ilovaga tarqatadi."}, {"q": "Huawei GMS o'rniga qaysi do'konni ishga tushirdi?", "o": ["AppGallery", "Play Market", "App Store", "Galaxy Store"], "a": 0, "e": "HMS ekotizimining do'koni - AppGallery."}, {"q": "Fused Location bino ichida nima uchun ishlaydi?", "o": ["Bino ichida GPS signali kuchayadi", "Wi-Fi va uyali minoralar ma'lumotidan ham foydalanadi", "U sun'iy yo'ldoshga bevosita ulanadi", "Telefon avtomatik tashqariga chiqadi"], "a": 1, "e": "GPS sun'iy yo'ldoshlari bino ichida, metroda ko'rinmaydi."}, {"q": "SHA-1 keystore xeshi Firebase'ga kiritilganda nima kafolatlanadi?", "o": ["Ilova hajmi kichrayadi", "Ilova tezroq ochiladi", "Faqat shu kalit bilan imzolangan ilova so'rovlari qabul qilinadi", "Ilova reklamasiz bo'ladi"], "a": 2, "e": "Bu begona kishi sizning nomingizdan API so'rov yubora olmasligini ta'minlaydi."}, {"q": "<code>google-services.json<\/code> ichida qaysi ma'lumot bo'ladi?", "o": ["Foydalanuvchi parollari", "Ilovaning barcha rasmlari", "Telefon egasining ismi", "<code>project_id<\/code>, API kalit, <code>firebase_url<\/code>, <code>package_name<\/code>"], "a": 3, "e": "package_name sizning applicationId'ingizga mos keladi."}, {"q": "<code>local.properties<\/code> nima uchun GitHub'ga tushmaydi?", "o": ["U avtomatik <code>.gitignore<\/code> ro'yxatida bo'ladi", "U juda katta hajmli", "Faqat Windows'da mavjud", "Uni Git o'qiy olmaydi"], "a": 0, "e": "Shuning uchun kalitni u yerda saqlash xavfsiz."}, {"q": "Google Play qaysi yildan yangi ilovalar uchun AAB'ni majburiy qildi?", "o": ["2008-yildan", "2021-yil avgustdan", "2015-yildan", "2025-yildan"], "a": 1, "e": "APK dan farqli AAB Dynamic Delivery'ni qo'llab-quvvatlaydi."}, {"q": "APK ichida qaysi protsessor arxitekturasi resurslari bo'ladi?", "o": ["Faqat bittasi", "Faqat x86", "arm64-v8a, armeabi-v7a, x86_64 (barchasi)", "Hech qaysisi"], "a": 2, "e": "Shu sababli an'anaviy APK hajmi katta."}, {"q": "Qurilmalarni boshqarish, o'rnatish va log kuzatish uchun SDK'ning qaysi qismi javob beradi?", "o": ["SDK Platforms", "SDK Build-Tools", "Layout Editor", "SDK Platform-Tools (ADB)"], "a": 3, "e": "adb devices, adb install, adb logcat Platform-Tools tarkibida."}, {"q": "<code>adb install app.apk<\/code> nima qiladi?", "o": ["APK'ni ulangan telefon yoki emulyatorga o'rnatadi", "APK'ni kompyuterdan o'chiradi", "APK'ni Play Store'ga yuklaydi", "Telefonni qayta yoqadi"], "a": 0, "e": "adb install kompyuterdan qurilmaga ilovani o'rnatadi."}, {"q": "<code>adb shell<\/code> nima imkon beradi?", "o": ["Faqat ekranni aylantirish", "Telefonning Linux buyruqlar qatoriga kirish", "Kamerani yoqish", "Batareyani almashtirish"], "a": 1, "e": "Android Linux asosida bo'lgani uchun shell mavjud."}, {"q": "SDK Manager orqali nimalarni boshqarish mumkin?", "o": ["Faqat ilova ikonkalarini", "Telefon operatorini", "Android platformalari va SDK vositalarini o'rnatish/yangilash", "Google hisobini"], "a": 2, "e": "SDK Platforms va SDK Tools yorliqlari mavjud."}, {"q": "<code>r8<\/code> ning qo'shimcha vazifasi qaysi?", "o": ["Rasm tahrirlash", "Internet ulash", "Tarjima qilish", "Shrinking va Obfuscation - keraksiz kodni tozalash va kodni chalkashtirish"], "a": 3, "e": "Bu ilovani kichraytiradi va himoyalaydi."}, {"q": "Google Maps API kalitini xavfsiz ulash va GMS yo'q qurilmani hisobga olish bo'yicha qaysi juftlik to'g'ri?", "o": ["Kalit <code>local.properties<\/code> da; <code>GoogleApiAvailability<\/code> bilan GMS tekshiriladi", "Kalit <code>MainActivity.kt<\/code> da; tekshiruv kerak emas", "Kalit GitHub README'da; tekshiruv kerak emas", "Kalit <code>strings.xml<\/code> da ochiq; HMS ishlatiladi"], "a": 0, "e": "4-5-darslarni bog'laydi: kalit xavfsizligi va qurilmada GMS mavjudligi."}, {"q": "Firebase'ga ulanishda SHA-1 ni qayerdan olamiz?", "o": ["Telefon sozlamalaridan", "Android Studio terminalida <code>./gradlew signingReport<\/code> bilan", "Google Play'dan", "Emulyator oynasidan"], "a": 1, "e": "5-dars buyrug'i Android Studio (6-dars) terminalida ishga tushiriladi."}, {"q": "Test uchun APK'ni telefonga o'rnatish va Play'ga yuklash formati qaysi juftlikda to'g'ri?", "o": ["Play uchun APK; <code>adb<\/code> kerak emas", "Faqat AAB; <code>adb install<\/code> ishlatilmaydi", "<code>adb install app.apk<\/code>; Play uchun AAB", "Faqat <code>.dex<\/code> yuklanadi"], "a": 2, "e": "adb o'rnatish uchun, AAB esa Google Play talabi."}, {"q": "<code>signingReport<\/code> SHA-1 ni qaysi fayldan o'qiydi va bu fayl qaysi vosita bilan ishlaydi?", "o": ["<code>strings.xml<\/code> dan, aapt2 orqali", "<code>AndroidManifest.xml<\/code> dan, ADB orqali", "<code>local.properties<\/code> dan, FCM orqali", "<code>.android/debug.keystore<\/code> dan, Gradle orqali"], "a": 3, "e": "Gradle kompyuterdagi debug keystore ochiq sertifikatining xeshini chiqaradi (5-dars), Gradle esa Android Studio muhitining dvigateli (6-dars)."}]</script>
<script>
(function(){
var Q=JSON.parse(document.getElementById('qdata').textContent),i=0,score=0,wrong=[],done=false;
var $=function(s){return document.querySelector(s)},card=$('#card'),next=$('#next');
function esc(t){return t}
function show(){
  var q=Q[i];done=false;
  $('#cnt').textContent='Savol '+(i+1)+' / '+Q.length;$('#sc').textContent='To\u2018g\u2018ri: '+score;
  $('#fill').style.width=(i/Q.length*100)+'%';
  var h='<p class="q">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,k){h+='<button class="opt" type="button" data-k="'+k+'"><b>'+'ABCDEFGH'[k]+'</b><span>'+o+'</span></button>'});
  h+='</div><div class="explain" id="ex"></div>';card.innerHTML=h;
  next.textContent=i==Q.length-1?'Natijani ko\u2018rish':'Keyingi savol';next.disabled=true;
  card.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){pick(+b.dataset.k)})});
  window.scrollTo(0,0);
}
function pick(k){
  if(done)return;done=true;var q=Q[i],bs=card.querySelectorAll('.opt');
  bs.forEach(function(b,j){b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  if(k==q.a)score++;else wrong.push({q:q.q,y:q.o[k],c:q.o[q.a]});
  var ex=$('#ex');ex.innerHTML=(k==q.a?'<b>To\u2018g\u2018ri!</b> ':'<b>Noto\u2018g\u2018ri.</b> ')+(q.e||'');ex.classList.add('show');
  $('#sc').textContent='To\u2018g\u2018ri: '+score;next.disabled=false;
  ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  var p=Math.round(score/Q.length*100);
  $('#fill').style.width='100%';$('#cnt').textContent='Natija';
  var msg=p>=90?'Ajoyib!':p>=70?'Yaxshi natija!':p>=50?'Yomon emas, takrorlab ko\u2018ring.':'Mavzuni qayta o\u2018qib chiqing.';
  var h='<div class="res"><div class="n">'+score+' / '+Q.length+'</div><div>'+p+'% \u2014 '+msg+'</div></div>';
  if(wrong.length){h+='<h3>Xatolar tahlili</h3><div class="rev">';wrong.forEach(function(w){h+='<div><b>'+w.q+'</b><br><small>Sizning javobingiz: '+w.y+'</small><br>To\u2018g\u2018ri javob: '+w.c+'</div>'});h+='</div>'}
  card.innerHTML=h;next.textContent='Qayta urinish';next.disabled=false;next.onclick=function(){i=0;score=0;wrong=[];next.onclick=adv;show()};
  window.scrollTo(0,0);
}
function adv(){if(i<Q.length-1){i++;show()}else finish()}
next.onclick=adv;
document.addEventListener('keydown',function(e){
  var n=parseInt(e.key,10);if(n>=1&&n<=Q[i].o.length&&!done&&card.querySelector('.opt'))pick(n-1);
  else if((e.key=='Enter'||e.key==' ')&&!next.disabled&&document.activeElement.tagName!='BUTTON'){e.preventDefault();next.onclick()}
});
show();
})();
</script>
</body>
</html>
