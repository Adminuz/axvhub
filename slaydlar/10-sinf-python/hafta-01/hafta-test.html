<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>1-hafta testi</title>
<link rel="icon" href="../../../reveal/logo.png">
<script src="../../../reveal/tema.js"></script>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--mut:#667;--card:#f4f5f7;--bd:#d5d8de;--ac:#2a6df4;--ok:#1a8f4a;--okbg:#e3f6ea;--no:#c62828;--nobg:#fdeaea}
[data-theme=dark]{--bg:#1e1e1e;--fg:#eee;--mut:#9aa;--card:#2a2b2e;--bd:#44464b;--ac:#5b9bff;--ok:#4cc77f;--okbg:#17321f;--no:#ff7b72;--nobg:#3a1c1c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:40px;height:40px;object-fit:contain}
h1{font-size:1.15rem;line-height:1.3;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:8px 0 14px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:8px;display:none}
.explain.show{display:block}
code{font-family:ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:.92em}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
.foot div{max-width:720px;margin:0 auto}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding:12px 0}.res .n{font-size:3rem;font-weight:700}
.rev{margin-top:16px;display:grid;gap:10px;text-align:left}
.rev div{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.rev small{color:var(--mut)}
.theme-toggle{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:0;display:grid;place-items:center;z-index:5;cursor:pointer}.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
header{padding-right:48px}.opt{-webkit-tap-highlight-color:transparent;user-select:none}
@media(min-width:700px){body{font-size:18px}.wrap{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="../../../reveal/logo.png" alt="AXV"><h1>1-hafta testi</h1></header>
<div class="badges"><span class="badge">10-sinf</span><span class="badge">Advanced Python Back-end</span><span class="badge">1-hafta</span><span class="badge">20 ta savol &amp;middot; taxminan 18 daqiqa</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<main id="card"></main>
</div>
<div class="foot"><div><button class="btn" id="next" type="button" disabled>Keyingi savol</button></div></div>
<script type="application/json" id="qdata">[{"q": "Sahifa to'liq qayta yuklanmasdan o'zgarishi va server faqat JSON uzatishi qaysi usulga xos?", "o": ["CSR/USR", "SSR", "Ikkalasiga ham", "Hech qaysisiga"], "a": 0, "e": "CSR/USR da server faqat ma'lumot beradi, DOM brauzerda quriladi."}, {"q": "Next.js, Nuxt.js yoki Prerender nima uchun ishlatiladi?", "o": ["Ma'lumotlar bazasi uchun", "CSR ilovalarida SEO muammosini hal qilish uchun", "Virtual muhit uchun", "Serializer yozish uchun"], "a": 1, "e": "CSR da SEO murakkab, shu vositalar qo'shimcha chora bo'lib xizmat qiladi."}, {"q": "«Bitta backend — ko'p frontend» g'oyasi nimani bildiradi?", "o": ["Bitta server faqat bitta brauzerga xizmat qiladi", "Backendni har platforma uchun qayta yozish kerak", "Bitta REST API dan Web, iOS, Android va Telegram bot foydalana oladi", "Frontend backend ichida yoziladi"], "a": 2, "e": "JSON qaytaruvchi API platformaga bog'liq emas."}, {"q": "Mijoz va serverni mustaqil rivojlantirish imkonini beradigan REST tamoyili qaysi?", "o": ["Stateless", "Uniform Interface", "Caching", "Client-Server ajratilganligi"], "a": 3, "e": "Interfeys va backend ajratilgan, shuning uchun alohida rivojlanadi."}, {"q": "DRF ning Web Browsable API imkoniyati nima beradi?", "o": ["API ni brauzer orqali to'g'ridan-to'g'ri ko'rish va sinash", "Saytni tezlashtiradi", "Parollarni shifrlaydi", "HTML shablon yaratadi"], "a": 0, "e": "Brauzerda <code>/api/v1/posts/<\/code> ni ochib, so'rovlarni sinab ko'rish mumkin."}, {"q": "Trello kabi drag-and-drop doskasi uchun qaysi usul mos?", "o": ["SSR, chunki SEO muhim", "USR (SPA), chunki yuqori interaktivlik kerak", "SSR, chunki server yuki oz", "Statik HTML"], "a": 1, "e": "Kartani ko'chirishda sahifa qayta yuklanmasligi kerak."}, {"q": "Ushbu loyiha papka strukturasida <code>apps/<\/code> ichida qaysi ilova izohlarni boshqaradi?", "o": ["<code>common<\/code>", "<code>news<\/code>", "<code>comments<\/code>", "<code>accounts<\/code>"], "a": 2, "e": "<code>comments<\/code> izohlar tizimi, <code>news<\/code> yangilik, kategoriya va teglar uchun."}, {"q": "<code>.gitignore<\/code> ga qaysi narsalar kiritilishi kerak?", "o": ["<code>manage.py<\/code> va <code>models.py<\/code>", "<code>requirements.txt<\/code> va <code>urls.py<\/code>", "Barcha .py fayllar", "<code>venv<\/code>, <code>.env<\/code>, media"], "a": 3, "e": "Muhit, maxfiy kalitlar va yuklangan fayllar omborga tushmasligi kerak."}, {"q": "<code>.env.example<\/code> fayli nima uchun yaratiladi?", "o": ["Boshqa dasturchilarga qanday o'zgaruvchilar kerakligini ko'rsatuvchi shablon sifatida", "Haqiqiy parollarni saqlash uchun", "Django ni tezlashtirish uchun", "Migratsiya uchun"], "a": 0, "e": "Unda haqiqiy qiymatlar emas, namunaviy qiymatlar bo'ladi."}, {"q": "<code>os.getenv('DEBUG', 'False')<\/code> da ikkinchi argument nima?", "o": ["Ma'lumotlar bazasi nomi", "O'zgaruvchi topilmasa ishlatiladigan standart qiymat", "Xato matni", "Paket versiyasi"], "a": 1, "e": "<code>.env<\/code> da DEBUG bo'lmasa, 'False' olinadi."}, {"q": "Post jadvalidagi <code>status<\/code> maydoni qaysi qiymatlarni qabul qiladi?", "o": ["<code>open<\/code>, <code>closed<\/code>", "<code>new<\/code>, <code>old<\/code>", "<code>draft<\/code>, <code>published<\/code>, <code>archived<\/code>", "<code>guest<\/code>, <code>user<\/code>, <code>admin<\/code>"], "a": 2, "e": "Qoralama, e'lon qilingan va arxivlangan holatlar."}, {"q": "Nega <code>slug<\/code> maydonlari <code>unique=True<\/code> bo'lishi kerak?", "o": ["Tezroq saqlash uchun", "Parolni himoya qilish uchun", "Django talab qilgani uchun", "Har bir yozuvni URL orqali bir ma'noli topish uchun"], "a": 3, "e": "Bir xil slug ikki yozuvni URL da ajrata olmaydi."}, {"q": "Post modeliga <code>['status', 'published_at']<\/code> indeksi nima uchun qo'yiladi?", "o": ["Qidiruv va filtrni tezlashtirish uchun", "Maydonlarni yashirish uchun", "Unikallikni tekshirish uchun", "JSON hajmini kamaytirish uchun"], "a": 0, "e": "Indeks bazada tez qidirish imkonini beradi."}, {"q": "Category va Tag modelida <code>slug<\/code> kiritilmasa, <code>save()<\/code> nima qiladi?", "o": ["Xato beradi", "<code>slugify(self.name)<\/code> orqali avtomatik to'ldiradi", "Bo'sh qoldiradi", "ID ni slug qiladi"], "a": 1, "e": "Slug nomdan avtomatik yasaladi."}, {"q": "<code>PostListSerializer<\/code> da <code>category = CategorySerializer(read_only=True)<\/code> nimani anglatadi?", "o": ["Kategoriya yozishda talab qilinadi", "Kategoriya o'chiriladi", "Kategoriya o'qishda to'liq obyekt ko'rinadi, lekin shu orqali yozib bo'lmaydi", "Kategoriya yashiriladi"], "a": 2, "e": "Nested serializer read_only bo'lib, yozish uchun ID <code>PostWriteSerializer<\/code> orqali beriladi."}, {"q": "<code>GET /posts/{slug}/<\/code> qaysi ViewSet amaliga (action) mos?", "o": ["<code>list<\/code>", "<code>create<\/code>", "<code>destroy<\/code>", "<code>retrieve<\/code>"], "a": 3, "e": "Bitta resursni olish — retrieve. Ro'yxat — list."}, {"q": "<code>lookup_field = 'slug'<\/code> nimani o'zgartiradi?", "o": ["URL da resurs ID o'rniga slug orqali topiladi", "Maydon nomini", "Javob formatini", "Ruxsatlarni"], "a": 0, "e": "Endi <code>/posts/my-news/<\/code> kabi manzil ishlaydi."}, {"q": "<code>apps.news<\/code> ilovasi ishlashi uchun u qaysi ro'yxatda yozilgan bo'lishi kerak va qaysi dars mavzusi bilan bog'liq?", "o": ["<code>MIDDLEWARE<\/code>; 1-dars", "<code>INSTALLED_APPS<\/code> (LOCAL_APPS); 2-dars sozlamalari", "<code>ALLOWED_HOSTS<\/code>; 3-dars", "<code>DATABASES<\/code>; 1-dars"], "a": 1, "e": "2-darsda LOCAL_APPS ro'yxati INSTALLED_APPS ga qo'shiladi, 3-darsda esa shu ilova ichiga modellar yoziladi."}, {"q": "1-darsdagi REST tamoyillaridan qaysi biri 3-darsdagi <code>DefaultRouter<\/code> natijasi bilan bevosita bog'liq?", "o": ["Stateless: router sessiyani saqlaydi", "Client-Server: router HTML qaytaradi", "Uniform Interface: standart URL va HTTP metodlari", "Hech biri"], "a": 2, "e": "Router resurslarni standart URL va GET/POST/PUT/PATCH/DELETE orqali ochadi."}, {"q": "Quyidagilardan qaysi tartib to'g'ri: loyiha yaratish va ishga tushirishda dastlab nima, so'ng nima?", "o": ["Serializer, venv, migrate", "Router, venv, model", "migrate, venv, router", "venv va paketlar, modellar, makemigrations/migrate, ViewSet va router"], "a": 3, "e": "Muhit va sozlamalar (2-dars), keyin model, migratsiya, serializer, view, router (3-dars)."}]</script>
<script>
(function(){
var Q=JSON.parse(document.getElementById('qdata').textContent),i=0,score=0,wrong=[],done=false;
var $=function(s){return document.querySelector(s)},card=$('#card'),next=$('#next');
function esc(t){return t}
function show(){
  var q=Q[i];done=false;
  $('#cnt').textContent='Savol '+(i+1)+' / '+Q.length;$('#sc').textContent='To\u2018g\u2018ri: '+score;
  $('#fill').style.width=(i/Q.length*100)+'%';
  var h='<p class="q">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,k){h+='<button class="opt" type="button" data-k="'+k+'"><b>'+'ABCDEFGH'[k]+'</b><span>'+o+'</span></button>'});
  h+='</div><div class="explain" id="ex"></div>';card.innerHTML=h;
  next.textContent=i==Q.length-1?'Natijani ko\u2018rish':'Keyingi savol';next.disabled=true;
  card.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){pick(+b.dataset.k)})});
  window.scrollTo(0,0);
}
function pick(k){
  if(done)return;done=true;var q=Q[i],bs=card.querySelectorAll('.opt');
  bs.forEach(function(b,j){b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  if(k==q.a)score++;else wrong.push({q:q.q,y:q.o[k],c:q.o[q.a]});
  var ex=$('#ex');ex.innerHTML=(k==q.a?'<b>To\u2018g\u2018ri!</b> ':'<b>Noto\u2018g\u2018ri.</b> ')+(q.e||'');ex.classList.add('show');
  $('#sc').textContent='To\u2018g\u2018ri: '+score;next.disabled=false;
  ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  var p=Math.round(score/Q.length*100);
  $('#fill').style.width='100%';$('#cnt').textContent='Natija';
  var msg=p>=90?'Ajoyib!':p>=70?'Yaxshi natija!':p>=50?'Yomon emas, takrorlab ko\u2018ring.':'Mavzuni qayta o\u2018qib chiqing.';
  var h='<div class="res"><div class="n">'+score+' / '+Q.length+'</div><div>'+p+'% \u2014 '+msg+'</div></div>';
  if(wrong.length){h+='<h3>Xatolar tahlili</h3><div class="rev">';wrong.forEach(function(w){h+='<div><b>'+w.q+'</b><br><small>Sizning javobingiz: '+w.y+'</small><br>To\u2018g\u2018ri javob: '+w.c+'</div>'});h+='</div>'}
  card.innerHTML=h;next.textContent='Qayta urinish';next.disabled=false;next.onclick=function(){i=0;score=0;wrong=[];next.onclick=adv;show()};
  window.scrollTo(0,0);
}
function adv(){if(i<Q.length-1){i++;show()}else finish()}
next.onclick=adv;
document.addEventListener('keydown',function(e){
  var n=parseInt(e.key,10);if(n>=1&&n<=Q[i].o.length&&!done&&card.querySelector('.opt'))pick(n-1);
  else if((e.key=='Enter'||e.key==' ')&&!next.disabled&&document.activeElement.tagName!='BUTTON'){e.preventDefault();next.onclick()}
});
show();
})();
</script>
</body>
</html>
