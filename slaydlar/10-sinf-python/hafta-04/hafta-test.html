<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>4-hafta testi</title>
<link rel="icon" href="../../../reveal/logo.png">
<script src="../../../reveal/tema.js"></script>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--mut:#667;--card:#f4f5f7;--bd:#d5d8de;--ac:#2a6df4;--ok:#1a8f4a;--okbg:#e3f6ea;--no:#c62828;--nobg:#fdeaea}
[data-theme=dark]{--bg:#1e1e1e;--fg:#eee;--mut:#9aa;--card:#2a2b2e;--bd:#44464b;--ac:#5b9bff;--ok:#4cc77f;--okbg:#17321f;--no:#ff7b72;--nobg:#3a1c1c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:40px;height:40px;object-fit:contain}
h1{font-size:1.15rem;line-height:1.3;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:8px 0 14px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:8px;display:none}
.explain.show{display:block}
code{font-family:ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:.92em}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
.foot div{max-width:720px;margin:0 auto}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding:12px 0}.res .n{font-size:3rem;font-weight:700}
.rev{margin-top:16px;display:grid;gap:10px;text-align:left}
.rev div{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.rev small{color:var(--mut)}
.theme-toggle{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:0;display:grid;place-items:center;z-index:5;cursor:pointer}.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
header{padding-right:48px}.opt{-webkit-tap-highlight-color:transparent;user-select:none}
@media(min-width:700px){body{font-size:18px}.wrap{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="../../../reveal/logo.png" alt="AXV"><h1>4-hafta testi</h1></header>
<div class="badges"><span class="badge">10-sinf</span><span class="badge">Advanced Python Back-end</span><span class="badge">4-hafta</span><span class="badge">20 ta savol &amp;middot; taxminan 15 daqiqa</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<main id="card"></main>
</div>
<div class="foot"><div><button class="btn" id="next" type="button" disabled>Keyingi savol</button></div></div>
<script type="application/json" id="qdata">[{"q": "DRF da <code>request.user<\/code> qachon <code>AnonymousUser<\/code> bo'ladi?", "o": ["Foydalanuvchi admin bo'lsa", "So'rov egasi kimligini isbotlay olmasa", "Token muddati uzaytirilsa", "Throttling yoqilgan bo'lsa"], "a": 1, "e": "Autentifikatsiya bloklamaydi, faqat kimligini aniqlaydi; bloklash Permissions ishi."}, {"q": "Session autentifikatsiyasining asosiy kamchiligi qaysi?", "o": ["Hech qanday cookie ishlatmaydi", "Mobil ilovalarda eng yaxshi ishlaydi", "Parolni Base64 da yuboradi", "Faqat brauzer uchun qulay va CSRF ga moyil"], "a": 3, "e": "Brauzer cookie ni avtomatik yuboradi, shu sababli CSRF xavfi bor."}, {"q": "Token Authentication ning kamchiligi qaysi?", "o": ["Har so'rovda tokenni tekshirish uchun bazaga murojaat kerak", "Token Base64 da saqlanadi", "U faqat GET so'rovlarda ishlaydi", "U muddati o'tmaydigan bo'lishi mumkin emas"], "a": 0, "e": "Bu Database Lookup Performance muammosi; JWT uni hal qiladi."}, {"q": "Refresh token nima uchun ishlatiladi?", "o": ["Har API so'rovini imzolash uchun", "Parolni saqlash uchun", "Muddati tugagan Access tokenning yangisini olish uchun", "CORS ruxsatini olish uchun"], "a": 2, "e": "Refresh uzoq yashaydi, faqat serverning maxsus manziliga yuboriladi."}, {"q": "Qaysi ruxsat sinfi mehmonga faqat o'qishga (GET) ruxsat beradi?", "o": ["IsAdminUser", "AllowAny", "IsAuthenticated", "IsAuthenticatedOrReadOnly"], "a": 3, "e": "O'zgartirish (POST, PUT, DELETE) uchun tizimga kirish talab qilinadi."}, {"q": "ScopedRateThrottle qachon qo'llanadi?", "o": ["Alohida nozik joy (masalan parolni tiklash) uchun limit qo'yishda", "Faqat adminlar uchun", "Faqat statik fayllar uchun", "Barcha View larga bir xil limit uchun"], "a": 0, "e": "Masalan, parolni tiklashni kuniga 3 marta bilan cheklash."}, {"q": "Productionda baza sifatida nega SQLite o'rniga PostgreSQL tanlanadi?", "o": ["SQLite pullik", "PostgreSQL SQL ni qo'llamaydi", "SQLite da yozish bloklanadi (database lock), PostgreSQL parallel yozuvlarni ko'taradi", "SQLite faqat Windows da ishlaydi"], "a": 2, "e": "Bir soniyada ko'p POST kelsa SQLite qotib qolishi mumkin."}, {"q": "Deploy da sirlar (SECRET_KEY, parollar) qayerda saqlanadi?", "o": ["settings.py ichida ochiq", ".env faylida, u .gitignore da turadi", "README faylida", "Docker image nomida"], "a": 1, "e": "settings.py ularni <code>os.environ<\/code> orqali o'qiydi."}, {"q": "Qaysi komponent SSL (HTTPS) ni boshqaradi (SSL Termination)?", "o": ["Nginx", "Django ORM", "Alembic", "Pydantic"], "a": 0, "e": "Nginx shifrlangan so'rovni ochib, Gunicorn ga oddiy HTTP ko'rinishida beradi."}, {"q": "Dockerfile da <code>requirements.txt<\/code> nega kod dan oldin alohida COPY qilinadi?", "o": ["Python buni talab qiladi", "Image hajmi nolga tushadi", "Kod o'zgarganda kutubxonalar qayta o'rnatilmaydi: build cache tezlashadi", "Gunicorn faqat shunday ishlaydi"], "a": 2, "e": "Layer cache: o'zgarmagan qatlamlar qayta bajarilmaydi."}, {"q": "Compose dagi <code>volumes<\/code> nima uchun kerak?", "o": ["Konteynerni tezlashtirish uchun", "Parollarni shifrlash uchun", "Portlarni yopish uchun", "Konteyner qayta ishga tushsa ham ma'lumot yo'qolmasligi uchun"], "a": 3, "e": "postgres_data, staticfiles, media volume lari saqlanib qoladi."}, {"q": "CI/CD da CI qismi nima qiladi?", "o": ["Serverni o'chiradi", "git push dan keyin testlarni avtomatik yurgizib kodni tekshiradi", "Faqat dizaynni yangilaydi", "Bazani o'chirib qayta yaratadi"], "a": 1, "e": "Test yiqilsa robot jarayonni to'xtatadi; yashil bo'lsa CD serverga yetkazadi."}, {"q": "FastAPI loyihasida <code>/docs<\/code> sahifasi nima?", "o": ["Admin panel", "Baza dizayneri", "Swagger: avtomatik interaktiv API hujjati", "Docker konsoli"], "a": 2, "e": "Skeleton tekshiruvida /health bilan birga /docs ham ochiladi."}, {"q": "Monolit <code>main.py<\/code> qanday muammo keltiradi?", "o": ["Kodni o'qish va test qilish qiyinlashadi", "Python ishlamay qoladi", "Baza ulanmaydi", "FastAPI ishga tushmaydi"], "a": 0, "e": "Modulli tuzilma (Separation of Concerns) kengaytirishni osonlashtiradi."}, {"q": "E-Library TT ga ko'ra kitobni kim tahrirlay oladi?", "o": ["Istalgan mehmon", "Faqat uning egasi (owner)", "Faqat Guest", "Hech kim"], "a": 1, "e": "Create/update/delete faqat owner uchun; ownership qoidasi service qatlamida bo'ladi."}, {"q": "<code>.env.example<\/code> faylining vazifasi nima?", "o": ["Haqiqiy parollarni GitHub da saqlash", "Docker image ni yaratish", "Migratsiyalarni bajarish", "Kerakli o'zgaruvchilar namunasi: undan .env nusxa olinadi"], "a": 3, "e": "Namunada haqiqiy sirlar bo'lmaydi, shuning uchun uni repoga qo'shish mumkin."}, {"q": "<code>alembic revision --autogenerate<\/code> ishlashi uchun nima shart?", "o": ["Faqat .env bo'sh bo'lishi", "Docker ishlab turishi", "env.py da <code>target_metadata = Base.metadata<\/code> va modellar import qilingan bo'lishi", "Swagger ochiq bo'lishi"], "a": 2, "e": "Aks holda Alembic jadvallarni ko'rmaydi."}, {"q": "10- va 11-darslarni bog'lang: productionda xavfsiz cookie sozlamalari qayerda yoziladi?", "o": ["prod.py da: SESSION_COOKIE_SECURE va CSRF_COOKIE_SECURE", "Dockerfile ichida", "Nginx dagi /static/ blokida", "alembic.ini da"], "a": 0, "e": "Xavfsizlik sozlamalari prod.py ga kiradi, sirlar esa .env.prod dan o'qiladi."}, {"q": "Throttling counter lari DRF da qayerda hisoblanadi va productionda nima tavsiya etiladi?", "o": ["Faqat Nginx loglarida", "Bazadagi users jadvalida", "JWT payload ida", "Cache tizimida; productionda masalan Redis"], "a": 3, "e": "Uslubiy ko'rsatmada Redis cache/throttling counters uchun ixtiyoriy komponent sifatida keltirilgan."}, {"q": "11- va 12-darslarni bog'lang: FastAPI loyihasi uchun deploy da nima o'zgaradi?", "o": ["Nginx kerak bo'lmay qoladi", "WSGI/Gunicorn o'rniga ASGI server (Uvicorn) ishlatiladi", "Baza ishlatilmaydi", "Docker ishlamaydi"], "a": 1, "e": "Asinxron FastAPI Uvicorn bilan ishga tushadi; Docker va Nginx g'oyasi o'zgarmaydi."}]</script>
<script>
(function(){
var Q=JSON.parse(document.getElementById('qdata').textContent),i=0,score=0,wrong=[],done=false;
var $=function(s){return document.querySelector(s)},card=$('#card'),next=$('#next');
function esc(t){return t}
function show(){
  var q=Q[i];done=false;
  $('#cnt').textContent='Savol '+(i+1)+' / '+Q.length;$('#sc').textContent='To\u2018g\u2018ri: '+score;
  $('#fill').style.width=(i/Q.length*100)+'%';
  var h='<p class="q">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,k){h+='<button class="opt" type="button" data-k="'+k+'"><b>'+'ABCDEFGH'[k]+'</b><span>'+o+'</span></button>'});
  h+='</div><div class="explain" id="ex"></div>';card.innerHTML=h;
  next.textContent=i==Q.length-1?'Natijani ko\u2018rish':'Keyingi savol';next.disabled=true;
  card.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){pick(+b.dataset.k)})});
  window.scrollTo(0,0);
}
function pick(k){
  if(done)return;done=true;var q=Q[i],bs=card.querySelectorAll('.opt');
  bs.forEach(function(b,j){b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  if(k==q.a)score++;else wrong.push({q:q.q,y:q.o[k],c:q.o[q.a]});
  var ex=$('#ex');ex.innerHTML=(k==q.a?'<b>To\u2018g\u2018ri!</b> ':'<b>Noto\u2018g\u2018ri.</b> ')+(q.e||'');ex.classList.add('show');
  $('#sc').textContent='To\u2018g\u2018ri: '+score;next.disabled=false;
  ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  var p=Math.round(score/Q.length*100);
  $('#fill').style.width='100%';$('#cnt').textContent='Natija';
  var msg=p>=90?'Ajoyib!':p>=70?'Yaxshi natija!':p>=50?'Yomon emas, takrorlab ko\u2018ring.':'Mavzuni qayta o\u2018qib chiqing.';
  var h='<div class="res"><div class="n">'+score+' / '+Q.length+'</div><div>'+p+'% \u2014 '+msg+'</div></div>';
  if(wrong.length){h+='<h3>Xatolar tahlili</h3><div class="rev">';wrong.forEach(function(w){h+='<div><b>'+w.q+'</b><br><small>Sizning javobingiz: '+w.y+'</small><br>To\u2018g\u2018ri javob: '+w.c+'</div>'});h+='</div>'}
  card.innerHTML=h;next.textContent='Qayta urinish';next.disabled=false;next.onclick=function(){i=0;score=0;wrong=[];next.onclick=adv;show()};
  window.scrollTo(0,0);
}
function adv(){if(i<Q.length-1){i++;show()}else finish()}
next.onclick=adv;
document.addEventListener('keydown',function(e){
  var n=parseInt(e.key,10);if(n>=1&&n<=Q[i].o.length&&!done&&card.querySelector('.opt'))pick(n-1);
  else if((e.key=='Enter'||e.key==' ')&&!next.disabled&&document.activeElement.tagName!='BUTTON'){e.preventDefault();next.onclick()}
});
show();
})();
</script>
</body>
</html>
