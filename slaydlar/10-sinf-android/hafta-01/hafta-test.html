<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>1-hafta testi</title>
<link rel="icon" href="../../../reveal/logo.png">
<script src="../../../reveal/tema.js"></script>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--mut:#667;--card:#f4f5f7;--bd:#d5d8de;--ac:#2a6df4;--ok:#1a8f4a;--okbg:#e3f6ea;--no:#c62828;--nobg:#fdeaea}
[data-theme=dark]{--bg:#1e1e1e;--fg:#eee;--mut:#9aa;--card:#2a2b2e;--bd:#44464b;--ac:#5b9bff;--ok:#4cc77f;--okbg:#17321f;--no:#ff7b72;--nobg:#3a1c1c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:40px;height:40px;object-fit:contain}
h1{font-size:1.15rem;line-height:1.3;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:8px 0 14px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:8px;display:none}
.explain.show{display:block}
code{font-family:ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:.92em}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
.foot div{max-width:720px;margin:0 auto}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding:12px 0}.res .n{font-size:3rem;font-weight:700}
.rev{margin-top:16px;display:grid;gap:10px;text-align:left}
.rev div{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.rev small{color:var(--mut)}
.theme-toggle{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:0;display:grid;place-items:center;z-index:5;cursor:pointer}.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
header{padding-right:48px}.opt{-webkit-tap-highlight-color:transparent;user-select:none}
@media(min-width:700px){body{font-size:18px}.wrap{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="../../../reveal/logo.png" alt="AXV"><h1>1-hafta testi</h1></header>
<div class="badges"><span class="badge">10-sinf</span><span class="badge">Advanced Android</span><span class="badge">1-hafta</span><span class="badge">20 ta savol &amp;middot; taxminan 18 daqiqa</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<main id="card"></main>
</div>
<div class="foot"><div><button class="btn" id="next" type="button" disabled>Keyingi savol</button></div></div>
<script type="application/json" id="qdata">[{"q": "<code>gradle.properties<\/code> faylida odatda nima saqlanadi?", "o": ["Global JVM parametrlari, masalan Gradle uchun ajratiladigan RAM (<code>org.gradle.jvmargs<\/code>)", "Kutubxonalar ro'yxati", "Modullar ro'yxati", "Ilova ikonkasi"], "a": 0, "e": "Masalan, <code>-Xmx4096m<\/code> Gradle uchun xotirani oshiradi. Juda katta qiymat (8 GB RAM da 6 GB) tizimni qotiradi."}, {"q": "<code>targetSdk<\/code> nimani bildiradi?", "o": ["Eng past qo'llab-quvvatlanadigan versiyani", "Ilova qaysi tizim talablari va xavfsizlik qoidalariga moslab sinalganini", "Kompilyator versiyasini", "Ilova versiyasini"], "a": 1, "e": "Google Play <code>targetSdk<\/code> ni so'nggi versiyalarda ushlab turishni talab qiladi."}, {"q": "<code>versionName \"2.1-beta\"<\/code> kimga mo'ljallangan?", "o": ["Google Play yangilanish tekshiruviga", "Gradle ga", "Foydalanuvchiga ko'rsatiladigan versiya nomi", "Kompilyatorga"], "a": 2, "e": "<code>versionName<\/code> matn, faqat ko'rsatish uchun; yangilanishni <code>versionCode<\/code> belgilaydi."}, {"q": "Vazifalarning ketma-ket bajarilishi va APK yaratilishi Gradle ning qaysi bosqichida bo'ladi?", "o": ["Initialization", "Configuration", "Sync", "Execution"], "a": 3, "e": "Execution da kod kompilyatsiya qilinadi, resurslar siqiladi va <code>.apk<\/code>/<code>.aab<\/code> yaratiladi."}, {"q": "Debug APK yaratadigan buyruq qaysi?", "o": ["<code>./gradlew assembleDebug<\/code>", "<code>./gradlew clean<\/code>", "<code>./gradlew tasks<\/code>", "<code>./gradlew --version<\/code>"], "a": 0, "e": "<code>assembleDebug<\/code> sinov (Debug) APK faylini yig'adi."}, {"q": "Project-level va Module-level <code>build.gradle<\/code> farqi nimada?", "o": ["Farqi yo'q, bir xil fayl", "Project-level hamma modullarga umumiy qoidalar, Module-level <code>:app<\/code> ga xos sozlamalar", "Module-level faqat plaginlar uchun", "Project-level faqat versionCode uchun"], "a": 1, "e": "<code>compileSdk<\/code>, <code>defaultConfig<\/code> va dependency'lar Module-level faylda yoziladi."}, {"q": "Debug build turida odatda nima bo'ladi?", "o": ["Kod chalkashtiriladi", "Debug qilish taqiqlanadi", "Kod siqilmaydi, loglar ochiq, breakpoint qo'yish mumkin", "Resurslar o'chiriladi"], "a": 2, "e": "Debug maksimal tezlikda yig'iladi va nosozliklarni topishga qulay."}, {"q": "Test serveriga (Staging) va haqiqiy serverga (Production) ulanuvchi ilova uchun nima qulay?", "o": ["Ikkita alohida loyihani nusxalash", "Kodda qo'lda URL ni o'zgartirib yurish", "Faqat Debug build", "Product Flavors va <code>BASE_URL<\/code> ni <code>buildConfigField<\/code> bilan berish"], "a": 3, "e": "Har flavorda o'z <code>BASE_URL<\/code> e'lon qilinadi, kod esa bitta qoladi."}, {"q": "<code>paidDebug<\/code> varianti nimani bildiradi?", "o": ["Sinov uchun mo'ljallangan to'liq VIP (pullik) versiya", "Google Play uchun pullik versiya", "Bepul Release", "Faqat reklama versiyasi"], "a": 0, "e": "<code>paid<\/code> flavor + <code>debug<\/code> build type."}, {"q": "<code>BuildConfig<\/code> klassi qanday paydo bo'ladi?", "o": ["Dasturchi qo'lda yozadi", "Gradle yig'ish paytida avtomatik yaratadi", "Android Studio o'rnatilganda keladi", "Google Play yaratadi"], "a": 1, "e": "<code>build.gradle<\/code> dagi <code>buildConfigField<\/code> qiymatlari shu klassga o'tadi."}, {"q": "API maxfiy kalitlarini qayerda saqlash tavsiya etiladi?", "o": ["To'g'ridan-to'g'ri <code>build.gradle<\/code> da ochiq", "<code>README<\/code> faylida", "<code>local.properties<\/code> faylida", "Kotlin kodida konstanta sifatida"], "a": 2, "e": "Ochiq kodda qoldirilgan kalitlar xavfsizlikka zarar yetkazadi."}, {"q": "<code>mavenCentral()<\/code> ombori nimaga mo'ljallangan?", "o": ["Faqat Google kutubxonalari", "Faqat rasmlar uchun", "Lokal kesh", "Dunyodagi eng yirik ochiq Java va Kotlin kutubxonalari ombori"], "a": 3, "e": "Gradle kutubxonalarni shu serverlardan yuklab oladi."}, {"q": "Espresso UI testlari qaysi konfiguratsiya bilan ulanadi?", "o": ["<code>androidTestImplementation<\/code>", "<code>testImplementation<\/code>", "<code>compileOnly<\/code>", "<code>api<\/code>"], "a": 0, "e": "Bu testlar qurilma yoki emulyatorda ishlaydi."}, {"q": "<code>runtimeOnly<\/code> nimani bildiradi?", "o": ["Faqat kompilyatsiyada kerak", "Kutubxona kompilyatsiyada ko'rinmaydi, faqat ilova ishlayotganda kerak", "Faqat testlarda", "Boshqa modullarga ochiq"], "a": 1, "e": "<code>compileOnly<\/code> aksincha: faqat kompilyatsiya paytida kerak va APK ga kirmaydi."}, {"q": "Hardcoded versiyalar usulining asosiy kamchiligi nima?", "o": ["Ilova ishlamaydi", "Internet talab qiladi", "10 ta modulda har bir versiyani alohida qidirib o'zgartirish kerak bo'ladi", "Faqat Kotlin'da ishlaydi"], "a": 2, "e": "Version Catalog versiyalarni bitta markazda saqlab, bu muammoni yo'qotadi."}, {"q": "Coil (<code>io.coil-kt:coil-compose:2.6.0<\/code>) ni Version Catalog ga qo'shib, qanday chaqiriladi?", "o": ["<code>implementation libs.coil-compose<\/code>", "<code>implementation coil.compose.2.6.0<\/code>", "<code>implementation libs.versions.coil<\/code>", "<code>implementation libs.coil.compose<\/code>"], "a": 3, "e": "<code>[versions]<\/code> da <code>coil<\/code>, <code>[libraries]<\/code> da <code>coil-compose<\/code> e'lon qilinib, nuqta bilan chaqiriladi."}, {"q": "Bir Version Catalog yangilanganda Debug va Release variantlari uchun nima o'zgaradi?", "o": ["Ikkalasi ham yangi versiya bilan yig'iladi, chunki katalog umumiy", "Faqat Debug", "Faqat Release", "Hech narsa o'zgarmaydi"], "a": 0, "e": "Katalog versiyalarni barcha build variantlari uchun markazlashtiradi."}, {"q": "Release da <code>minifyEnabled true<\/code> bo'lsa, <code>versionCode<\/code>ni oshirish qaysi darslar mavzusini bog'laydi?", "o": ["Debug uchun <code>versionCode<\/code> kerak emas", "Google Play'ga yangi Release yuklashda <code>versionCode<\/code> oshishi shart (1 va 2-darslar)", "<code>versionCode<\/code> faqat R8 uchun", "Bog'liqlik yo'q"], "a": 1, "e": "Release yig'ma Google Play'ga yuklanadi, do'kon esa faqat oshgan <code>versionCode<\/code> ni qabul qiladi."}, {"q": "<code>free<\/code> va <code>paid<\/code> flavorlarda bir xil kutubxona kerak. Eng to'g'ri joy qayerda?", "o": ["Har flavor uchun alohida nusxa loyiha", "Har flavorda qo'lda hardcoded versiya", "Umumiy <code>dependencies<\/code> bloki, versiya esa <code>libs.versions.toml<\/code> da", "Faqat <code>settings.gradle<\/code>"], "a": 2, "e": "Dependencies umumiy, flavor farqlari esa <code>productFlavors<\/code> da qoladi."}, {"q": "Yangi <code>libs.versions.toml<\/code> qatori qo'shildi, lekin Android Studio uni tanimayapti. Birinchi qadam?", "o": ["<code>./gradlew clean<\/code> ni o'chirish", "Telefonni qayta yoqish", "<code>minSdk<\/code> ni oshirish", "Gradle Sync (Sync Now) qilish"], "a": 3, "e": "Har qanday toml yoki gradle o'zgarishidan keyin sinxronizatsiya shart."}]</script>
<script>
(function(){
var Q=JSON.parse(document.getElementById('qdata').textContent),i=0,score=0,wrong=[],done=false;
var $=function(s){return document.querySelector(s)},card=$('#card'),next=$('#next');
function esc(t){return t}
function show(){
  var q=Q[i];done=false;
  $('#cnt').textContent='Savol '+(i+1)+' / '+Q.length;$('#sc').textContent='To\u2018g\u2018ri: '+score;
  $('#fill').style.width=(i/Q.length*100)+'%';
  var h='<p class="q">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,k){h+='<button class="opt" type="button" data-k="'+k+'"><b>'+'ABCDEFGH'[k]+'</b><span>'+o+'</span></button>'});
  h+='</div><div class="explain" id="ex"></div>';card.innerHTML=h;
  next.textContent=i==Q.length-1?'Natijani ko\u2018rish':'Keyingi savol';next.disabled=true;
  card.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){pick(+b.dataset.k)})});
  window.scrollTo(0,0);
}
function pick(k){
  if(done)return;done=true;var q=Q[i],bs=card.querySelectorAll('.opt');
  bs.forEach(function(b,j){b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  if(k==q.a)score++;else wrong.push({q:q.q,y:q.o[k],c:q.o[q.a]});
  var ex=$('#ex');ex.innerHTML=(k==q.a?'<b>To\u2018g\u2018ri!</b> ':'<b>Noto\u2018g\u2018ri.</b> ')+(q.e||'');ex.classList.add('show');
  $('#sc').textContent='To\u2018g\u2018ri: '+score;next.disabled=false;
  ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  var p=Math.round(score/Q.length*100);
  $('#fill').style.width='100%';$('#cnt').textContent='Natija';
  var msg=p>=90?'Ajoyib!':p>=70?'Yaxshi natija!':p>=50?'Yomon emas, takrorlab ko\u2018ring.':'Mavzuni qayta o\u2018qib chiqing.';
  var h='<div class="res"><div class="n">'+score+' / '+Q.length+'</div><div>'+p+'% \u2014 '+msg+'</div></div>';
  if(wrong.length){h+='<h3>Xatolar tahlili</h3><div class="rev">';wrong.forEach(function(w){h+='<div><b>'+w.q+'</b><br><small>Sizning javobingiz: '+w.y+'</small><br>To\u2018g\u2018ri javob: '+w.c+'</div>'});h+='</div>'}
  card.innerHTML=h;next.textContent='Qayta urinish';next.disabled=false;next.onclick=function(){i=0;score=0;wrong=[];next.onclick=adv;show()};
  window.scrollTo(0,0);
}
function adv(){if(i<Q.length-1){i++;show()}else finish()}
next.onclick=adv;
document.addEventListener('keydown',function(e){
  var n=parseInt(e.key,10);if(n>=1&&n<=Q[i].o.length&&!done&&card.querySelector('.opt'))pick(n-1);
  else if((e.key=='Enter'||e.key==' ')&&!next.disabled&&document.activeElement.tagName!='BUTTON'){e.preventDefault();next.onclick()}
});
show();
})();
</script>
</body>
</html>
