<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>2-hafta testi</title>
<link rel="icon" href="../../../reveal/logo.png">
<script src="../../../reveal/tema.js"></script>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--mut:#667;--card:#f4f5f7;--bd:#d5d8de;--ac:#2a6df4;--ok:#1a8f4a;--okbg:#e3f6ea;--no:#c62828;--nobg:#fdeaea}
[data-theme=dark]{--bg:#1e1e1e;--fg:#eee;--mut:#9aa;--card:#2a2b2e;--bd:#44464b;--ac:#5b9bff;--ok:#4cc77f;--okbg:#17321f;--no:#ff7b72;--nobg:#3a1c1c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:40px;height:40px;object-fit:contain}
h1{font-size:1.15rem;line-height:1.3;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:8px 0 14px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:8px;display:none}
.explain.show{display:block}
code{font-family:ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:.92em}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
.foot div{max-width:720px;margin:0 auto}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding:12px 0}.res .n{font-size:3rem;font-weight:700}
.rev{margin-top:16px;display:grid;gap:10px;text-align:left}
.rev div{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.rev small{color:var(--mut)}
.theme-toggle{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:0;display:grid;place-items:center;z-index:5;cursor:pointer}.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
header{padding-right:48px}.opt{-webkit-tap-highlight-color:transparent;user-select:none}
@media(min-width:700px){body{font-size:18px}.wrap{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="../../../reveal/logo.png" alt="AXV"><h1>2-hafta testi</h1></header>
<div class="badges"><span class="badge">11-sinf</span><span class="badge">Professional IT development</span><span class="badge">2-hafta</span><span class="badge">20 ta savol &amp;middot; taxminan 18 daqiqa</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<main id="card"></main>
</div>
<div class="foot"><div><button class="btn" id="next" type="button" disabled>Keyingi savol</button></div></div>
<script type="application/json" id="qdata">[{"q": "<code>git branch -d feature/add-login<\/code> nima qiladi?", "o": ["Ishi bitgan tarmoqni o'chiradi", "Yangi tarmoq yaratadi", "Tarmoqqa o'tadi", "Tarmoqlarni birlashtiradi"], "a": 0, "e": "<code>-d<\/code> birlashgan tarmoqni o'chirish uchun."}, {"q": "Git Flow'da <code>release/*<\/code> tarmog'i nima uchun ochiladi?", "o": ["Hotfix uchun", "Yangi versiyani chiqarishdan oldin sinash va versiya raqamini belgilash uchun", "Yangi funksiya yozish uchun", "Konflikt hal qilish uchun"], "a": 1, "e": "Release tarmog'i chiqarishga tayyorlov bosqichi."}, {"q": "Git Flow qaysi loyihalarga mos?", "o": ["Kuniga bir necha marta deploy qiladigan startaplarga", "Faqat bir kishilik loyihalarga", "Relizlari kam va qat'iy sinovdan o'tadigan, masalan bank yoki tibbiy tizimlarga", "Faqat hujjatlarga"], "a": 2, "e": "Veb va startaplarda ko'pincha GitHub Flow ishlatiladi."}, {"q": "<code>feat!: drop support for python 3.8<\/code> dagi <code>!<\/code> nimani bildiradi?", "o": ["Xato bor", "Commit bekor qilindi", "Yangi tarmoq yaratildi", "Orqaga moslikni buzuvchi o'zgarish (breaking change)"], "a": 3, "e": "Breaking change <code>!<\/code> bilan belgilanadi."}, {"q": "Atomik commitning asosiy qoidasi nima?", "o": ["Bitta commit — bitta mantiqiy o'zgarish, u loyihani buzmasligi kerak", "Bitta commit — bitta kun", "Bitta commit — bitta fayl", "Doim bitta katta commit"], "a": 0, "e": "Atomik commit orqaga qaytarishni (revert) osonlashtiradi."}, {"q": "<code>git log --graph --oneline --all --decorate<\/code> nimani ko'rsatadi?", "o": ["Faqat oxirgi commit", "Barcha tarmoqlar va commitlarni daraxt ko'rinishida", "Faqat konfliktlar", "Faqat o'chirilgan fayllar"], "a": 1, "e": "Turli tarmoqlar va ularning boshlanish nuqtalari chiziqlar bilan ko'rinadi."}, {"q": "PR nima uchun «sifat eshigi» deyiladi?", "o": ["Chunki u kodni shifrlaydi", "Chunki u branchni o'chiradi", "Birlashishdan oldin CI testlari, linter va review shu yerda ishlaydi", "Chunki u serverni o'chiradi"], "a": 2, "e": "PR muhokama, avtomatik tekshiruv va tarix vazifasini bajaradi."}, {"q": "PR shablonidagi checklistga qaysi band tegishli?", "o": ["Reponi o'chirish", "Tarmoq nomini o'zgartirish", "Commit sonini oshirish", "Maxfiy ma'lumotlar (<code>.env<\/code>, tokenlar) yo'qligi tekshirildi"], "a": 3, "e": "Shablon: linter, testlar, hujjat va sirlar tekshiruvi."}, {"q": "Konfliktli fayldan keyin merge'dan voz kechish kerak bo'lsa nima ishlatiladi?", "o": ["<code>git merge --abort<\/code>", "<code>git clone<\/code>", "<code>git init<\/code>", "<code>git remote add<\/code>"], "a": 0, "e": "Merge boshlanishidan oldingi holatga qaytaradi."}, {"q": "Create a merge commit usulining kamchiligi nima?", "o": ["Tarix saqlanmaydi", "Katta jamoalarda tarix chalkash bo'lib ketishi", "Commitlar o'chadi", "PR yopilmaydi"], "a": 1, "e": "Afzalligi: tarix to'liq saqlanadi; kamchiligi: chigal graf."}, {"q": "Nega reviewer buyruq o'rniga savol berib, sabab keltiradi?", "o": ["Vaqtni cho'zish uchun", "Git talab qilgani uchun", "Hamkorlik madaniyatini saqlash va muallifga tushuntirish uchun", "Kodni yashirish uchun"], "a": 2, "e": "«Ikkita funksiyaga ajratsak qanday qaraysiz?» kabi sharh jamoani ruhlantiradi."}, {"q": "Code Review jamoaga qaysi foydani bermaydi?", "o": ["Xatolarni erta aniqlash", "Xavfsizlik", "Bilim almashish", "Server narxini kamaytirish"], "a": 3, "e": "Asosiy foydalar: erta xato topish, xavfsizlik, bilim almashish, kod tozaligi."}, {"q": "Reviewer <code>Comment<\/code> tanlasa nima bo'ladi?", "o": ["Savol beradi, lekin tasdiqlamaydi ham, bloklamaydi ham", "PR merge bo'ladi", "PR yopiladi", "PR o'chadi"], "a": 0, "e": "Approve va Request changes dan farqli, Comment neytral."}, {"q": "Branch Protection'da <code>Require approvals<\/code> qiymati 1 bo'lsa nima bo'ladi?", "o": ["Muallif o'zi merge qiladi", "Kamida bir boshqa muhandis Approve bosmaguncha Merge tugmasi nofaol", "Hamma commit o'chadi", "Testlar o'chiriladi"], "a": 1, "e": "Bu qoida loyiha egasiga ham tegishli bo'lishi mumkin."}, {"q": "Quyidagilardan qaysi biri <code>pull_request_template.md<\/code> ga xos?", "o": ["Dockerfile buyruqlari", "SQL jadvallar", "Tavsif, Why, o'zgarishlar va checklist bo'limlari", "SSH kalitlari"], "a": 2, "e": "Shablon PR tavsifini bir xil standartga keltiradi."}, {"q": "Feature branch ochildi, commit qilindi, lekin <code>main<\/code> ga tegishli fayl ko'rinmayapti. Sabab?", "o": ["Fayl o'chib ketgan", "Git buzilgan", "Commit yo'qolgan", "Fayl faqat feature branchda mavjud; <code>main<\/code> ga qaytganda ko'rinmaydi"], "a": 3, "e": "Tarmoqlar o'rtasida o'tganda ishchi papka mos commit holatiga o'zgaradi."}, {"q": "Bitta vazifa uchun to'liq professional oqim qaysi?", "o": ["Branch ochish, atomik Conventional commitlar, PR (What/Why/How), review, merge", "Commit to'g'ridan-to'g'ri <code>main<\/code> ga", "PR ochmasdan merge", "Bitta katta commit qilib push"], "a": 0, "e": "Hafta mavzulari birlashgan oqim."}, {"q": "PR'da Request changes olindi: Blocker va ikkita Nitpick bor. To'g'ri tartib qaysi?", "o": ["Faqat nitpick'larni tuzatish", "Blocker'ni albatta tuzatish, nitpick'larni ixtiyoriy ko'rib chiqish", "Hammasini e'tiborsiz qoldirish", "PR'ni yopib yangisini ochish"], "a": 1, "e": "Blocker tuzatilmaguncha merge taqiqlanadi; nitpick PR'ni to'xtatmaydi."}, {"q": "Qaysi vosita review'ni majburiy qiladi va <code>main<\/code> ni tasodifiy push'dan himoya qiladi?", "o": ["Conventional Commits", "<code>.gitignore<\/code>", "Branch Protection Rules", "Squash and merge"], "a": 2, "e": "Himoya qoidalari PR, approve va CI tekshiruvini talab qiladi."}, {"q": "Conventional Commits qoidasiga ko'ra commit xabari birinchi qatori qanday bo'lishi ma'qul?", "o": ["Uzun, o'tgan zamonda, nuqta bilan", "Faqat bosh harflarda", "Bo'sh qoldiriladi", "50 belgidan oshmaydi, fe'l buyruq maylida, oxirida nuqtasiz"], "a": 3, "e": "Misol: <code>add<\/code> (to'g'ri), <code>added<\/code> (noto'g'ri). Nuqta qo'yilmaydi."}]</script>
<script>
(function(){
var Q=JSON.parse(document.getElementById('qdata').textContent),i=0,score=0,wrong=[],done=false;
var $=function(s){return document.querySelector(s)},card=$('#card'),next=$('#next');
function esc(t){return t}
function show(){
  var q=Q[i];done=false;
  $('#cnt').textContent='Savol '+(i+1)+' / '+Q.length;$('#sc').textContent='To\u2018g\u2018ri: '+score;
  $('#fill').style.width=(i/Q.length*100)+'%';
  var h='<p class="q">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,k){h+='<button class="opt" type="button" data-k="'+k+'"><b>'+'ABCDEFGH'[k]+'</b><span>'+o+'</span></button>'});
  h+='</div><div class="explain" id="ex"></div>';card.innerHTML=h;
  next.textContent=i==Q.length-1?'Natijani ko\u2018rish':'Keyingi savol';next.disabled=true;
  card.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){pick(+b.dataset.k)})});
  window.scrollTo(0,0);
}
function pick(k){
  if(done)return;done=true;var q=Q[i],bs=card.querySelectorAll('.opt');
  bs.forEach(function(b,j){b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  if(k==q.a)score++;else wrong.push({q:q.q,y:q.o[k],c:q.o[q.a]});
  var ex=$('#ex');ex.innerHTML=(k==q.a?'<b>To\u2018g\u2018ri!</b> ':'<b>Noto\u2018g\u2018ri.</b> ')+(q.e||'');ex.classList.add('show');
  $('#sc').textContent='To\u2018g\u2018ri: '+score;next.disabled=false;
  ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  var p=Math.round(score/Q.length*100);
  $('#fill').style.width='100%';$('#cnt').textContent='Natija';
  var msg=p>=90?'Ajoyib!':p>=70?'Yaxshi natija!':p>=50?'Yomon emas, takrorlab ko\u2018ring.':'Mavzuni qayta o\u2018qib chiqing.';
  var h='<div class="res"><div class="n">'+score+' / '+Q.length+'</div><div>'+p+'% \u2014 '+msg+'</div></div>';
  if(wrong.length){h+='<h3>Xatolar tahlili</h3><div class="rev">';wrong.forEach(function(w){h+='<div><b>'+w.q+'</b><br><small>Sizning javobingiz: '+w.y+'</small><br>To\u2018g\u2018ri javob: '+w.c+'</div>'});h+='</div>'}
  card.innerHTML=h;next.textContent='Qayta urinish';next.disabled=false;next.onclick=function(){i=0;score=0;wrong=[];next.onclick=adv;show()};
  window.scrollTo(0,0);
}
function adv(){if(i<Q.length-1){i++;show()}else finish()}
next.onclick=adv;
document.addEventListener('keydown',function(e){
  var n=parseInt(e.key,10);if(n>=1&&n<=Q[i].o.length&&!done&&card.querySelector('.opt'))pick(n-1);
  else if((e.key=='Enter'||e.key==' ')&&!next.disabled&&document.activeElement.tagName!='BUTTON'){e.preventDefault();next.onclick()}
});
show();
})();
</script>
</body>
</html>
