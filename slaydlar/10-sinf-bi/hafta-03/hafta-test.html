<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>3-hafta testi</title>
<link rel="icon" href="../../../reveal/logo.png">
<script src="../../../reveal/tema.js"></script>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--mut:#667;--card:#f4f5f7;--bd:#d5d8de;--ac:#2a6df4;--ok:#1a8f4a;--okbg:#e3f6ea;--no:#c62828;--nobg:#fdeaea}
[data-theme=dark]{--bg:#1e1e1e;--fg:#eee;--mut:#9aa;--card:#2a2b2e;--bd:#44464b;--ac:#5b9bff;--ok:#4cc77f;--okbg:#17321f;--no:#ff7b72;--nobg:#3a1c1c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:40px;height:40px;object-fit:contain}
h1{font-size:1.15rem;line-height:1.3;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:8px 0 14px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:8px;display:none}
.explain.show{display:block}
code{font-family:ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:.92em}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
.foot div{max-width:720px;margin:0 auto}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding:12px 0}.res .n{font-size:3rem;font-weight:700}
.rev{margin-top:16px;display:grid;gap:10px;text-align:left}
.rev div{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.rev small{color:var(--mut)}
.theme-toggle{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:0;display:grid;place-items:center;z-index:5;cursor:pointer}.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
header{padding-right:48px}.opt{-webkit-tap-highlight-color:transparent;user-select:none}
@media(min-width:700px){body{font-size:18px}.wrap{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="../../../reveal/logo.png" alt="AXV"><h1>3-hafta testi</h1></header>
<div class="badges"><span class="badge">10-sinf</span><span class="badge">BI &amp;amp; ML</span><span class="badge">3-hafta</span><span class="badge">20 ta savol &amp;middot; taxminan 18 daqiqa</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<main id="card"></main>
</div>
<div class="foot"><div><button class="btn" id="next" type="button" disabled>Keyingi savol</button></div></div>
<script type="application/json" id="qdata">[{"q": "UNIQUE cheklovi nimani ta'minlaydi?", "o": ["Ustundagi barcha qiymatlar takrorlanmas bo'lishini", "Ustun bo'sh bo'lmasligini", "Qiymat shartga mos bo'lishini", "Standart qiymat tayinlanishini"], "a": 0, "e": "Masalan, pasport raqami, telefon, email unikal bo'lishi kerak."}, {"q": "<code>shahar TEXT DEFAULT 'Toshkent'<\/code> nima qiladi?", "o": ["Faqat Toshkentni qabul qiladi", "Qiymat kiritilmasa, avtomatik 'Toshkent' yoziladi", "Shaharni o'chiradi", "Shaharni PK qiladi"], "a": 1, "e": "DEFAULT standart qiymat beradi."}, {"q": "<code>UNIQUE (raqam, hudud)<\/code> jadvaliga 42-maktab Toshkent uchun ikkinchi marta kiritilsa nima bo'ladi?", "o": ["Eski yozuv o'chadi", "Yangi yozuv eskisiga qo'shiladi", "<code>IntegrityError<\/code> (UNIQUE buzildi)", "Xato bo'lmaydi"], "a": 2, "e": "(raqam, hudud) birikmasi takrorlanishi taqiqlangan."}, {"q": "Yangi o'qituvchini kiritish uchun maktabda sinf ochilgan bo'lishi shart bo'lib qolgan. Bu qaysi anomaliya?", "o": ["Update anomaly", "Deletion anomaly", "Referential integrity", "Insertion anomaly"], "a": 3, "e": "Bog'liq bo'lmagan ma'lumotni alohida kirita olmaslik qo'shish anomaliyasi."}, {"q": "<code>ON DELETE SET NULL<\/code> ota yozuv o'chirilganda nima qiladi?", "o": ["Bolalar jadvalidagi FK qiymatini <code>NULL<\/code> qiladi", "Bolalarni o'chiradi", "O'chirishni taqiqlaydi", "Ota yozuvni qaytaradi"], "a": 0, "e": "Bola yozuvlar qoladi, lekin ota bilan bog'lanishi uziladi."}, {"q": "Bitta o'quvchi bitta fandan bitta chorakda faqat bitta baho oladi. Qaysi PK mos?", "o": ["<code>PRIMARY KEY (oquvchi_id)<\/code>", "<code>PRIMARY KEY (oquvchi_id, fan_id, chorak)<\/code>", "<code>PRIMARY KEY (fan_id)<\/code>", "<code>PRIMARY KEY (baho)<\/code>"], "a": 1, "e": "Faqat bitta ustun PK bo'lsa, o'quvchi bitta baho olardi; uchlik kalit to'g'ri."}, {"q": "ERD dagi Relationship nimani bildiradi?", "o": ["Ustun ma'lumot turini", "Jadvaldagi qiymatni", "Obyektlar orasidagi bog'liqlikni", "Faylning nomini"], "a": 2, "e": "Masalan, \"O'quvchi maktabda o'qiydi\"."}, {"q": "1:1 munosabatga qaysi misol mos?", "o": ["Bitta maktab - ko'p o'quvchi", "Bitta o'quvchi - ko'p to'garak", "Bitta viloyat - ko'p maktab", "Bitta fuqaro - bitta biometrik pasport"], "a": 3, "e": "1:1 da bir obyekt boshqasining faqat bittasiga mos keladi."}, {"q": "<code>maktablar<\/code> jadvalida <code>hudud_id<\/code> nima?", "o": ["<code>hududlar.hudud_id<\/code> ga havola qiluvchi Foreign Key", "Primary Key", "CHECK cheklovi", "Jadval nomi"], "a": 0, "e": "Maktablar hududlarga 1:N bog'langan."}, {"q": "<code>hududlar<\/code>, <code>maktablar<\/code>, <code>yillik_kpi<\/code> ERD modelida <code>yillik_kpi<\/code> qaysi jadvalga FK orqali bog'langan?", "o": ["Faqat <code>maktablar<\/code>", "<code>hududlar<\/code>", "Hech qaysisiga", "<code>oquvchilar<\/code>"], "a": 1, "e": "<code>yillik_kpi.hudud_id<\/code> <code>hududlar.hudud_id<\/code> ga havola qiladi."}, {"q": "<code>SELECT<\/code> da hisoblangan ustunga nom berish uchun nima ishlatiladi?", "o": ["<code>LIKE<\/code>", "<code>LIMIT<\/code>", "<code>AS<\/code> (alias)", "<code>OFFSET<\/code>"], "a": 2, "e": "Masalan, <code>ROUND(sigim / 30.0, 1) AS taxminiy_xonalar_soni<\/code>."}, {"q": "<code>WHERE yil IN (2023, 2024)<\/code> nimani tekshiradi?", "o": ["Yil 2023 dan 2024 gacha barcha qiymatlar emasligini", "Yil <code>NULL<\/code> ekanligini", "Yil matn ekanligini", "Yil ro'yxatdagi qiymatlardan biriga tengligini"], "a": 3, "e": "<code>IN<\/code> ro'yxatdagi qiymatlardan biriga tenglikni tekshiradi."}, {"q": "<code>WHERE nomi LIKE '%viloyati'<\/code> qaysi hududlarni qaytaradi?", "o": ["Nomi \"viloyati\" bilan tugaydiganlarni", "\"viloyati\" bilan boshlanuvchilarni", "Aynan \"viloyati\" so'zini", "Hech qaysini"], "a": 0, "e": "<code>%<\/code> oldidagi qism ixtiyoriy bo'lishi mumkin."}, {"q": "<code>AND<\/code> va <code>OR<\/code> farqi qaysi?", "o": ["<code>AND<\/code> da bittasi, <code>OR<\/code> da ikkalasi", "<code>AND<\/code> da ikkala shart, <code>OR<\/code> da hech bo'lmaganda bittasi to'g'ri bo'lishi kerak", "Ikkalasi bir xil", "<code>OR<\/code> shartni teskarisiga aylantiradi"], "a": 1, "e": "<code>NOT<\/code> shartni teskarisiga aylantiradi."}, {"q": "Kodda <code>SELECT ... WHERE ...<\/code> yozilgan bo'lsa ham baza birinchi navbatda nimani bajaradi?", "o": ["<code>SELECT<\/code> - ustunlarni oladi", "<code>LIMIT<\/code> - kesadi", "<code>FROM<\/code> - jadvalni topadi", "<code>ORDER BY<\/code> - saralaydi"], "a": 2, "e": "Yozilish tartibi va bajarilish tartibi har xil."}, {"q": "Jadval ustunlari uchun noto'g'ri kiritishlarni baza darajasida to'xtatish uchun nima ishlatiladi?", "o": ["Faqat dashboard", "<code>ORDER BY<\/code>", "<code>LIMIT<\/code>", "Cheklovlar (<code>NOT NULL<\/code>, <code>CHECK<\/code>, <code>UNIQUE<\/code>, FK)"], "a": 3, "e": "Ma'lumotlar tozaligi cheklovlar orqali bazaning o'zida ta'minlanadi."}, {"q": "Mijoz o'chirilsa, uning barcha buyurtmalari ham avtomatik o'chishi kerak. Qaysi FK qoidasi mos?", "o": ["<code>ON DELETE CASCADE<\/code>", "<code>ON DELETE RESTRICT<\/code>", "<code>ON DELETE SET NULL<\/code>", "<code>DEFAULT<\/code>"], "a": 0, "e": "CASCADE ota bilan birga bolalarni ham o'chiradi."}, {"q": "Hudud va yil birikmasi unikal bo'lishi kerak. Composite PK va <code>UNIQUE (hudud_id, yil)<\/code> jadvalini 3-hafta darslarida bog'laydigan g'oya qaysi?", "o": ["Hududlarni yashirish", "Bir xil birikmaning takrorlanishini baza darajasida taqiqlash", "Yillarni o'chirish", "Jadvallarni birlashtirish"], "a": 1, "e": "Ikkala yondashuv ham ikki ustun birikmasi bo'yicha dublikatning oldini oladi."}, {"q": "M:N ni Junction table bilan yechish mantiqi 3-haftadagi qaysi tamoyil bilan mos?", "o": ["Ustunga massiv yozish", "Jadvallarni birlashtirib bitta qilish", "FK orqali har bir yozuv mavjud ota yozuvga bog'langan bo'lishi (referential integrity)", "Foreign key ni o'chirish"], "a": 2, "e": "Oraliq jadval ikki FK ga ega bo'lib, relyatsion yaxlitlikni saqlaydi."}, {"q": "Maktablar sig'imini <code>sigim / 30.0<\/code> bilan xonalar soniga aylantirib, 100 dan ko'p sig'imi bo'lganlarni TOP-3 chiqarish uchun SQL bo'laklarining to'g'ri tartibi qaysi?", "o": ["SELECT, LIMIT 3, WHERE, ORDER BY", "LIMIT 3, ORDER BY, WHERE, FROM", "ORDER BY, FROM, LIMIT 3, WHERE", "FROM, WHERE, SELECT (hisoblash), ORDER BY, LIMIT 3"], "a": 3, "e": "Filtr, hisoblash, saralash va kesish tartibi SQL ning mantiqiy bajarilish tartibiga mos."}]</script>
<script>
(function(){
var Q=JSON.parse(document.getElementById('qdata').textContent),i=0,score=0,wrong=[],done=false;
var $=function(s){return document.querySelector(s)},card=$('#card'),next=$('#next');
function esc(t){return t}
function show(){
  var q=Q[i];done=false;
  $('#cnt').textContent='Savol '+(i+1)+' / '+Q.length;$('#sc').textContent='To\u2018g\u2018ri: '+score;
  $('#fill').style.width=(i/Q.length*100)+'%';
  var h='<p class="q">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,k){h+='<button class="opt" type="button" data-k="'+k+'"><b>'+'ABCDEFGH'[k]+'</b><span>'+o+'</span></button>'});
  h+='</div><div class="explain" id="ex"></div>';card.innerHTML=h;
  next.textContent=i==Q.length-1?'Natijani ko\u2018rish':'Keyingi savol';next.disabled=true;
  card.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){pick(+b.dataset.k)})});
  window.scrollTo(0,0);
}
function pick(k){
  if(done)return;done=true;var q=Q[i],bs=card.querySelectorAll('.opt');
  bs.forEach(function(b,j){b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  if(k==q.a)score++;else wrong.push({q:q.q,y:q.o[k],c:q.o[q.a]});
  var ex=$('#ex');ex.innerHTML=(k==q.a?'<b>To\u2018g\u2018ri!</b> ':'<b>Noto\u2018g\u2018ri.</b> ')+(q.e||'');ex.classList.add('show');
  $('#sc').textContent='To\u2018g\u2018ri: '+score;next.disabled=false;
  ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  var p=Math.round(score/Q.length*100);
  $('#fill').style.width='100%';$('#cnt').textContent='Natija';
  var msg=p>=90?'Ajoyib!':p>=70?'Yaxshi natija!':p>=50?'Yomon emas, takrorlab ko\u2018ring.':'Mavzuni qayta o\u2018qib chiqing.';
  var h='<div class="res"><div class="n">'+score+' / '+Q.length+'</div><div>'+p+'% \u2014 '+msg+'</div></div>';
  if(wrong.length){h+='<h3>Xatolar tahlili</h3><div class="rev">';wrong.forEach(function(w){h+='<div><b>'+w.q+'</b><br><small>Sizning javobingiz: '+w.y+'</small><br>To\u2018g\u2018ri javob: '+w.c+'</div>'});h+='</div>'}
  card.innerHTML=h;next.textContent='Qayta urinish';next.disabled=false;next.onclick=function(){i=0;score=0;wrong=[];next.onclick=adv;show()};
  window.scrollTo(0,0);
}
function adv(){if(i<Q.length-1){i++;show()}else finish()}
next.onclick=adv;
document.addEventListener('keydown',function(e){
  var n=parseInt(e.key,10);if(n>=1&&n<=Q[i].o.length&&!done&&card.querySelector('.opt'))pick(n-1);
  else if((e.key=='Enter'||e.key==' ')&&!next.disabled&&document.activeElement.tagName!='BUTTON'){e.preventDefault();next.onclick()}
});
show();
})();
</script>
</body>
</html>
