<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>2-hafta testi</title>
<link rel="icon" href="../../../reveal/logo.png">
<script src="../../../reveal/tema.js"></script>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--mut:#667;--card:#f4f5f7;--bd:#d5d8de;--ac:#2a6df4;--ok:#1a8f4a;--okbg:#e3f6ea;--no:#c62828;--nobg:#fdeaea}
[data-theme=dark]{--bg:#1e1e1e;--fg:#eee;--mut:#9aa;--card:#2a2b2e;--bd:#44464b;--ac:#5b9bff;--ok:#4cc77f;--okbg:#17321f;--no:#ff7b72;--nobg:#3a1c1c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:40px;height:40px;object-fit:contain}
h1{font-size:1.15rem;line-height:1.3;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:8px 0 14px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:8px;display:none}
.explain.show{display:block}
code{font-family:ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:.92em}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
.foot div{max-width:720px;margin:0 auto}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding:12px 0}.res .n{font-size:3rem;font-weight:700}
.rev{margin-top:16px;display:grid;gap:10px;text-align:left}
.rev div{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.rev small{color:var(--mut)}
.theme-toggle{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:0;display:grid;place-items:center;z-index:5;cursor:pointer}.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
header{padding-right:48px}.opt{-webkit-tap-highlight-color:transparent;user-select:none}
@media(min-width:700px){body{font-size:18px}.wrap{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="../../../reveal/logo.png" alt="AXV"><h1>2-hafta testi</h1></header>
<div class="badges"><span class="badge">10-sinf</span><span class="badge">BI &amp;amp; ML</span><span class="badge">2-hafta</span><span class="badge">20 ta savol &amp;middot; taxminan 18 daqiqa</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<main id="card"></main>
</div>
<div class="foot"><div><button class="btn" id="next" type="button" disabled>Keyingi savol</button></div></div>
<script type="application/json" id="qdata">[{"q": "Parquet faylining boshidagi 4 baytlik sehrli belgi qanday?", "o": ["<code>PAR1<\/code>", "<code>AVRO<\/code>", "<code>JSON<\/code>", "<code>CSV1<\/code>"], "a": 0, "e": "File Header faylning Parquet ekanini bildiruvchi <code>PAR1<\/code> belgisini saqlaydi."}, {"q": "Row Group nima?", "o": ["Bitta ustun nomi", "Katta datasetning mantiqiy satr guruhi (odatda 128-512 MB)", "Faylning oxirgi qismi", "Siqish algoritmi"], "a": 1, "e": "Har bir Row Group ichida har ustun uchun alohida Column Chunk bo'ladi."}, {"q": "Siqish va shifrlash Parquet'da qaysi darajada bajariladi?", "o": ["File Header darajasida", "Faqat Footer darajasida", "Page darajasida", "Row darajasida, qator bo'yicha"], "a": 2, "e": "Column Chunk sahifalarga (Data Page, Dictionary Page) bo'linadi, siqish shu yerda."}, {"q": "Parquet'da standart siqish turi qaysi?", "o": ["Gzip", "Siqishsiz", "ZIP", "Snappy"], "a": 3, "e": "Snappy tez ishlagani uchun default hisoblanadi."}, {"q": "Parquet bir xil turdagi qiymatlarni yonma-yon saqlaydi. Bu nimani beradi?", "o": ["Yuqori siqilishni (fayl hajmi 70-85% gacha kamayishi)", "Faylni inson o'qishini", "Qator qo'shishni tezlatishni", "Sxemasiz ishlashni"], "a": 0, "e": "Bir xil tur ma'lumotlar siqish algoritmlariga qulay."}, {"q": "Qaysi holatda satrli (row-based) saqlash ortiqcha disk I/O sarflaydi?", "o": ["Yangi qator qo'shilganda", "50 ustunli jadvaldan faqat bitta ustun o'rtachasi kerak bo'lganda", "Bitta yozuv to'liq o'qilganda", "Jadval kichik bo'lganda"], "a": 1, "e": "Faqat bitta ustun kerak bo'lsa ham barcha ustunlar diskdan o'qiladi."}, {"q": "Avro qaysi dasturlash tillari o'rtasida ma'lumotni bir xil qat'iyat bilan almashishga yordam beradi?", "o": ["Faqat Python", "Faqat Java", "Java, Python, C++, Go va boshqalar", "Faqat SQL"], "a": 2, "e": "Avro ning maqsadi - tillar o'rtasida ma'lumot almashish."}, {"q": "Forward Compatibility nimani bildiradi?", "o": ["Yangi sxema eski ma'lumotni o'qiy oladi", "Sxema o'zgarmas", "Ma'lumot siqilmaydi", "Eski sxema bilan yangi kod yozgan ma'lumotni o'qish mumkin"], "a": 3, "e": "Oldinga moslik - yangi maydonlar e'tiborga olinmaydi."}, {"q": "Avro jadvaldagi qaysi jihat bo'yicha eng yaxshi natija ko'rsatadi?", "o": ["Yozish tezligi (append-only) va Schema Evolution", "Tahlil tezligi (OLAP)", "Inson o'qiy olishi", "Ustunli siqish"], "a": 0, "e": "Avro yozishda o'ta tez va schema evolution'da juda mukammal; OLAP da Parquet kuchli."}, {"q": "Quyidagi formatlardan qaysi birining sxemasi ixtiyoriy yoki noaniq?", "o": ["Avro", "JSON", "Parquet", "Ichki sxemali har qanday format"], "a": 1, "e": "JSON da sxema ixtiyoriy/noaniq, Avro va Parquet da qat'iy."}, {"q": "Do'kon mahsulotlari Avro sxemasida <code>izoh<\/code> ixtiyoriy matn maydoni sifatida qanday e'lon qilinadi?", "o": ["<code>{'name': 'izoh', 'type': 'int'}<\/code>", "<code>{'name': 'izoh'}<\/code>, turisiz", "<code>{'name': 'izoh', 'type': ['null', 'string'], 'default': None}<\/code>", "<code>{'type': 'izoh'}<\/code>, nomisiz"], "a": 2, "e": "Union tur <code>['null','string']<\/code> va default maydonni ixtiyoriy qiladi."}, {"q": "Quyidagi hajm tartibi (kattadan kichikka) odatda qaysi?", "o": ["Parquet, Avro, CSV, JSON", "CSV, JSON, Parquet, Avro", "Avro, Parquet, JSON, CSV", "JSON, CSV, Avro, Parquet"], "a": 3, "e": "JSON kalit nomlarini takrorlaydi, Parquet ustunli siqish tufayli eng kichik."}, {"q": "Qaysi cheklovlar orqali RDBMS ustunga noto'g'ri qiymat kiritilishiga yo'l qo'ymaydi?", "o": ["<code>CHECK<\/code>, <code>NOT NULL<\/code>, <code>UNIQUE<\/code>", "<code>SELECT<\/code>, <code>JOIN<\/code>, <code>LIMIT<\/code>", "Faqat <code>COMMIT<\/code>", "Faqat <code>PRAGMA<\/code>"], "a": 0, "e": "RDBMS data integrity ni cheklovlar orqali ta'minlaydi, CSV da esa matn yozib qo'yish mumkin."}, {"q": "ACID dagi \"D\" (Durability) nima?", "o": ["Tranzaksiyalar bir-biridan ajralgan", "COMMIT dan keyin server o'chsa ham ma'lumot diskda qoladi", "Faqat qoidalarga mos o'zgarish qabul qilinadi", "Tranzaksiya bo'linmaydi"], "a": 1, "e": "Muvaffaqiyatli yakunlangan operatsiya saqlanib qoladi."}, {"q": "Bitta o'quvchi ko'p to'garakka qatnashadi, to'garakda ko'p o'quvchi. Bu qaysi munosabat?", "o": ["1:1", "1:N", "M:N", "N:1, faqat bitta tomonlama"], "a": 2, "e": "Ikki tomonlama ko'pga-ko'p bog'lanish M:N."}, {"q": "B-Tree indekslarning vazifasi nima?", "o": ["Parolni shifrlash", "Faylni siqish", "Jadvalni nusxalash", "Milliardlab qator ichidan yozuvni millisekundlarda topish"], "a": 3, "e": "Indekslar tufayli katta hajmda tezkor qidiruv mumkin."}, {"q": "<code>INNER JOIN<\/code> so'rovida <code>orders.customer_id = customers.customer_id<\/code> sharti nimani bajaradi?", "o": ["Buyurtmalarni ularga tegishli mijozlar bilan bog'laydi", "Mijozlarni o'chiradi", "Jadval yaratadi", "Narxni hisoblaydi"], "a": 0, "e": "JOIN FK va PK bo'yicha jadvallarni bog'lab, birlashtirilgan natija qaytaradi."}, {"q": "Bank tizimida Kafka orqali tranzaksiyalar (Avro) oqib keladi, keyin ular nima uchun RDBMS'ga yoziladi?", "o": ["Avro ni JSON ga aylantirish uchun", "Ishonchli saqlash (ACID), yaxlitlik va parallel foydalanish uchun", "Ustunli siqish uchun", "Fayl hajmini oshirish uchun"], "a": 1, "e": "Avro uzatish uchun, RDBMS tranzaksion ishonchlilik uchun; ikkalasi pipeline ning turli bosqichlari."}, {"q": "Raw eksport, streaming va analitik ombor uchun mos formatlar qatori qaysi?", "o": ["Parquet, CSV, Avro", "Avro, Parquet, CSV", "CSV, Avro, Parquet", "JSON, JSON, JSON"], "a": 2, "e": "CSV - raw/eksport, Avro - Kafka/streaming, Parquet - Data Lake Silver/Gold va DWH."}, {"q": "CSV da yetim yozuvlar (orphan records) paydo bo'lishi mumkin. Nima uchun Parquet yoki Avro bunga qarshi chora emas?", "o": ["Parquet FK ni avtomatik tekshiradi", "Avro orphan yozuvlarni o'chiradi", "CSV FK ni qo'llab-quvvatlaydi", "Faqat RDBMS ning FK cheklovi mavjud bo'lmagan ID ni rad etadi; fayl formatlari bog'lanishni tekshirmaydi"], "a": 3, "e": "Referential Integrity - ma'lumotlar bazasi xususiyati; fayl formatlari faqat saqlash usulini belgilaydi."}]</script>
<script>
(function(){
var Q=JSON.parse(document.getElementById('qdata').textContent),i=0,score=0,wrong=[],done=false;
var $=function(s){return document.querySelector(s)},card=$('#card'),next=$('#next');
function esc(t){return t}
function show(){
  var q=Q[i];done=false;
  $('#cnt').textContent='Savol '+(i+1)+' / '+Q.length;$('#sc').textContent='To\u2018g\u2018ri: '+score;
  $('#fill').style.width=(i/Q.length*100)+'%';
  var h='<p class="q">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,k){h+='<button class="opt" type="button" data-k="'+k+'"><b>'+'ABCDEFGH'[k]+'</b><span>'+o+'</span></button>'});
  h+='</div><div class="explain" id="ex"></div>';card.innerHTML=h;
  next.textContent=i==Q.length-1?'Natijani ko\u2018rish':'Keyingi savol';next.disabled=true;
  card.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){pick(+b.dataset.k)})});
  window.scrollTo(0,0);
}
function pick(k){
  if(done)return;done=true;var q=Q[i],bs=card.querySelectorAll('.opt');
  bs.forEach(function(b,j){b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  if(k==q.a)score++;else wrong.push({q:q.q,y:q.o[k],c:q.o[q.a]});
  var ex=$('#ex');ex.innerHTML=(k==q.a?'<b>To\u2018g\u2018ri!</b> ':'<b>Noto\u2018g\u2018ri.</b> ')+(q.e||'');ex.classList.add('show');
  $('#sc').textContent='To\u2018g\u2018ri: '+score;next.disabled=false;
  ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  var p=Math.round(score/Q.length*100);
  $('#fill').style.width='100%';$('#cnt').textContent='Natija';
  var msg=p>=90?'Ajoyib!':p>=70?'Yaxshi natija!':p>=50?'Yomon emas, takrorlab ko\u2018ring.':'Mavzuni qayta o\u2018qib chiqing.';
  var h='<div class="res"><div class="n">'+score+' / '+Q.length+'</div><div>'+p+'% \u2014 '+msg+'</div></div>';
  if(wrong.length){h+='<h3>Xatolar tahlili</h3><div class="rev">';wrong.forEach(function(w){h+='<div><b>'+w.q+'</b><br><small>Sizning javobingiz: '+w.y+'</small><br>To\u2018g\u2018ri javob: '+w.c+'</div>'});h+='</div>'}
  card.innerHTML=h;next.textContent='Qayta urinish';next.disabled=false;next.onclick=function(){i=0;score=0;wrong=[];next.onclick=adv;show()};
  window.scrollTo(0,0);
}
function adv(){if(i<Q.length-1){i++;show()}else finish()}
next.onclick=adv;
document.addEventListener('keydown',function(e){
  var n=parseInt(e.key,10);if(n>=1&&n<=Q[i].o.length&&!done&&card.querySelector('.opt'))pick(n-1);
  else if((e.key=='Enter'||e.key==' ')&&!next.disabled&&document.activeElement.tagName!='BUTTON'){e.preventDefault();next.onclick()}
});
show();
})();
</script>
</body>
</html>
