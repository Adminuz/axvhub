<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>1-hafta testi</title>
<link rel="icon" href="../../../reveal/logo.png">
<script src="../../../reveal/tema.js"></script>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--mut:#667;--card:#f4f5f7;--bd:#d5d8de;--ac:#2a6df4;--ok:#1a8f4a;--okbg:#e3f6ea;--no:#c62828;--nobg:#fdeaea}
[data-theme=dark]{--bg:#1e1e1e;--fg:#eee;--mut:#9aa;--card:#2a2b2e;--bd:#44464b;--ac:#5b9bff;--ok:#4cc77f;--okbg:#17321f;--no:#ff7b72;--nobg:#3a1c1c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:40px;height:40px;object-fit:contain}
h1{font-size:1.15rem;line-height:1.3;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--card);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:8px 0 14px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;touch-action:manipulation;overflow-wrap:anywhere}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:8px;display:none}
.explain.show{display:block}
code{font-family:ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:0 5px;font-size:.92em}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bd)}
.foot div{max-width:720px;margin:0 auto}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;padding:12px 0}.res .n{font-size:3rem;font-weight:700}
.rev{margin-top:16px;display:grid;gap:10px;text-align:left}
.rev div{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.rev small{color:var(--mut)}
.theme-toggle{position:fixed;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:0;display:grid;place-items:center;z-index:5;cursor:pointer}.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.sun{display:none}[data-theme=dark] .sun{display:block}[data-theme=dark] .moon{display:none}
header{padding-right:48px}.opt{-webkit-tap-highlight-color:transparent;user-select:none}
@media(min-width:700px){body{font-size:18px}.wrap{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="../../../reveal/logo.png" alt="AXV"><h1>1-hafta testi</h1></header>
<div class="badges"><span class="badge">9-sinf</span><span class="badge">Game Design</span><span class="badge">1-hafta</span><span class="badge">20 ta savol &amp;middot; taxminan 18 daqiqa</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="cnt"></span><span id="sc"></span></div>
<main id="card"></main>
</div>
<div class="foot"><div><button class="btn" id="next" type="button" disabled>Keyingi savol</button></div></div>
<script type="application/json" id="qdata">[{"q": "Unity dvijogi qaysi dasturlash tilidan foydalanadi va nimaga mo'ljallangan?", "o": ["C#; 2D/3D mobil, kompyuter va konsol o'yinlari uchun", "GDScript; faqat matnli o'yinlar uchun", "C++ va Blueprints; faqat AAA grafika uchun", "Vizual bloklar; faqat quti o'yinlari uchun"], "a": 0, "e": "Unity universal dvijok bo'lib, C# bilan ishlaydi."}, {"q": "Dasturchi va o'yin dizayneri farqi qaysi javobda to'g'ri?", "o": ["Dizayner kod yozadi, dasturchi hikoya yozadi", "Dasturchi kompyuterga nima qilishni aytadi, dizayner odamlar nima his qilishini o'ylab topadi", "Ikkalasi bir xil ish bajaradi", "Dasturchi faqat musiqa yozadi"], "a": 1, "e": "Dizayner qoidalar yozib, o'yinchi tajribasini loyihalaydi."}, {"q": "GDD (Game Design Document) nima?", "o": ["Tayyor o'yinning o'rnatuvchi fayli", "Faqat qahramon rasmlari to'plami", "O'yinning to'liq «pasporti»: g'oya, qahramonlar, bosqichlar, boshqaruv", "O'yin sotuvi bo'yicha hisobot"], "a": 2, "e": "GDD bo'lmasa, dasturchi va rassomlar bir-birini tushunmay qoladi."}, {"q": "Narratsiya komponenti nimani o'z ichiga oladi?", "o": ["Tugmalar va menyular", "Xarita va to'siqlar joylashuvi", "Ranglar va shriftlar", "Voqealar rivoji, qahramonlar, dialoglar va o'yin olami tarixi (Lore)"], "a": 3, "e": "Narratsiya — o'yin ichidagi hikoya va syujet."}, {"q": "Godot Engine ning asosiy xususiyati qaysi?", "o": ["Bepul, ochiq kodli va tezkor; GDScript tilida ishlaydi", "Pullik va faqat AAA grafikaga mo'ljallangan", "Faqat kod yozmasdan ishlaydi", "Faqat konsollar uchun"], "a": 0, "e": "Godot yengil va 2D o'yinlar uchun qulay."}, {"q": "Super Mario 1-bosqichida birinchi dushman o'yinchi ko'z o'ngida paydo bo'lishi dizayner uchun nimani bildiradi?", "o": ["Dushmanni yashirishni", "Tutorialsiz, intuitiv tarzda ustiga sakrashni o'rgatishni", "O'yin balansini buzishni", "Narratsiyani o'chirishni"], "a": 1, "e": "Level Design o'yinchini ko'rsatmasiz o'rgatishi mumkin."}, {"q": "Dead Space butun interfeysini diyegetik qildi. Bu o'yinchiga qanday ta'sir qiladi?", "o": ["Immersiya pasayadi", "O'yin 2D ga aylanadi", "Interfeys tabiiyroq bo'lgani uchun immersiya (sho'ng'ish) oshadi", "Barcha raqamlar ekran burchagiga ko'chadi"], "a": 2, "e": "Interfeys qanchalik tabiiy bo'lsa, sho'ng'ish shunchalik yuqori."}, {"q": "Pong, Atari 2600 va Tetris orasida kartrijlar davrini boshlab bergan qurilma qaysi?", "o": ["Magnavox Odyssey", "Bertie the Brain", "Nimatron", "Atari 2600"], "a": 3, "e": "Atari 2600 (1977) olinadigan kartrijlarni joriy etdi."}, {"q": "Magnavox Odyssey (1972) nima bilan mashhur?", "o": ["Televizorga ulanadigan birinchi uy video o'yin konsoli", "Birinchi tangali arkada avtomati", "Birinchi mobil telefon o'yini", "4 metrlik lampali mashina"], "a": 0, "e": "Konsol televizorga ulanib, faqat video o'yin uchun xizmat qiladi."}, {"q": "Bertie the Brain (1950) nima uchun yaratilgan?", "o": ["Shaxmat bo'yicha musobaqa uchun", "«Krestik-nolik» o'ynash uchun lampali mashina sifatida", "Tetris o'ynash uchun", "Stol tennisi uchun"], "a": 1, "e": "U 4 metrlik lampali mashina bo'lgan."}, {"q": "Action janri qanday talablar qo'yadi?", "o": ["Faqat uzoq muddatli rejalashtirish", "Faqat jumboq yechish", "Tezkor reflekslar, nishonga olish va chaqqonlik", "Faqat matn o'qish"], "a": 2, "e": "Shooter, Platformer va Fighting Action janriga kiradi."}, {"q": "Skyrim va The Witcher kabi o'yinlar qaysi janrga kiradi va nimasi bilan ajraladi?", "o": ["Puzzle; faqat jumboqlar bor", "Simulation; faqat transport boshqariladi", "Racing; faqat poyga bor", "RPG; qahramon darajasi oshadi, boy syujetga ega"], "a": 3, "e": "RPG xususiyatlarni kuchaytirish va syujetga tayanadi."}, {"q": "Arkada (Arcade) nima?", "o": ["O'yin zallaridagi tezkor refleks va sodda qoidali tangali avtomatlar", "Faqat uyda ishlatiladigan konsol", "Dasturlash tili", "Ta'limiy o'yin turi"], "a": 0, "e": "Pong arkada o'yinining yorqin namunasi."}, {"q": "Console (Konsol) nima?", "o": ["Tangali o'yin avtomati", "Televizor yoki monitorga ulanib, video o'yin o'ynashga mo'ljallangan qurilma", "Rasm tahrirlash dasturi", "Dasturchilar uchun xatolar oynasi"], "a": 1, "e": "Konsolga Magnavox Odyssey va Atari 2600 misol bo'ladi."}, {"q": "Chiroyli «Boshlash» tugmasi bosilgach, o'yin 3 soniya qotib qoldi. Qaysi xulosa to'g'ri?", "o": ["Ikkalasi ham yaxshi UI", "Ikkalasi ham UI ga kiradi", "Tugma — yaxshi UI, qotish — yomon UX", "Ikkalasi ham yaxshi UX"], "a": 2, "e": "UI ko'rinishni, UX esa his qilinadigan qulaylikni bildiradi."}, {"q": "Wireframe nima?", "o": ["Tayyor rangli o'yin menyusi", "3D model", "Ovoz effekti", "Interfeys elementlari joylashuvini ko'rsatuvchi rangsiz xom eskiz"], "a": 3, "e": "Wireframe interfeys loyihalashning birinchi bosqichi."}, {"q": "Qorli oq fonda ham, qorong'u g'orda ham matn aniq o'qilishi uchun nima tavsiya etiladi?", "o": ["Yuqori kontrast va matn atrofida nozik qora hoshiya (stroke)", "Matnni juda kichik qilish", "Matnni fon rangiga yaqin qilish", "Matnni faqat o'rtaga qo'yish"], "a": 0, "e": "Bu yaxshi HUD ning uchinchi oltin qoidasi."}, {"q": "Fitts qonuniga ko'ra ekranning qaysi qismidagi tugmalarni bosish eng oson?", "o": ["Aynan markazdagi", "4 ta burchakdagi", "Faqat yuqori o'rtadagi", "Faqat pastki o'rtadagi"], "a": 1, "e": "Shuning uchun mini-xarita va asosiy tugmalar burchaklarga qo'yiladi."}, {"q": "Doom (1993) dagi qonga belanib boruvchi qahramon yuzi qaysi interfeys turiga misol?", "o": ["Fazoviy interfeys", "Hech qanday interfeys emas", "Meta-interfeys", "Diyegetik interfeys"], "a": 2, "e": "U jarohatni o'yinchiga ekranda his qildiradi."}, {"q": "Super Mario haqidagi qaysi juftlik to'g'ri?", "o": ["Janr — Puzzle; ochkolar — diyegetik UI", "Janr — Simulation; ochkolar — meta UI", "Janr — RTS; ochkolar — fazoviy UI", "Janr — Action (Platformer); ochko va vaqt — nodiyegetik UI"], "a": 3, "e": "Platformer Action janriga kiradi, ochkolar esa ekran ustiga chiziladi."}]</script>
<script>
(function(){
var Q=JSON.parse(document.getElementById('qdata').textContent),i=0,score=0,wrong=[],done=false;
var $=function(s){return document.querySelector(s)},card=$('#card'),next=$('#next');
function esc(t){return t}
function show(){
  var q=Q[i];done=false;
  $('#cnt').textContent='Savol '+(i+1)+' / '+Q.length;$('#sc').textContent='To\u2018g\u2018ri: '+score;
  $('#fill').style.width=(i/Q.length*100)+'%';
  var h='<p class="q">'+q.q+'</p><div class="opts">';
  q.o.forEach(function(o,k){h+='<button class="opt" type="button" data-k="'+k+'"><b>'+'ABCDEFGH'[k]+'</b><span>'+o+'</span></button>'});
  h+='</div><div class="explain" id="ex"></div>';card.innerHTML=h;
  next.textContent=i==Q.length-1?'Natijani ko\u2018rish':'Keyingi savol';next.disabled=true;
  card.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){pick(+b.dataset.k)})});
  window.scrollTo(0,0);
}
function pick(k){
  if(done)return;done=true;var q=Q[i],bs=card.querySelectorAll('.opt');
  bs.forEach(function(b,j){b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  if(k==q.a)score++;else wrong.push({q:q.q,y:q.o[k],c:q.o[q.a]});
  var ex=$('#ex');ex.innerHTML=(k==q.a?'<b>To\u2018g\u2018ri!</b> ':'<b>Noto\u2018g\u2018ri.</b> ')+(q.e||'');ex.classList.add('show');
  $('#sc').textContent='To\u2018g\u2018ri: '+score;next.disabled=false;
  ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  var p=Math.round(score/Q.length*100);
  $('#fill').style.width='100%';$('#cnt').textContent='Natija';
  var msg=p>=90?'Ajoyib!':p>=70?'Yaxshi natija!':p>=50?'Yomon emas, takrorlab ko\u2018ring.':'Mavzuni qayta o\u2018qib chiqing.';
  var h='<div class="res"><div class="n">'+score+' / '+Q.length+'</div><div>'+p+'% \u2014 '+msg+'</div></div>';
  if(wrong.length){h+='<h3>Xatolar tahlili</h3><div class="rev">';wrong.forEach(function(w){h+='<div><b>'+w.q+'</b><br><small>Sizning javobingiz: '+w.y+'</small><br>To\u2018g\u2018ri javob: '+w.c+'</div>'});h+='</div>'}
  card.innerHTML=h;next.textContent='Qayta urinish';next.disabled=false;next.onclick=function(){i=0;score=0;wrong=[];next.onclick=adv;show()};
  window.scrollTo(0,0);
}
function adv(){if(i<Q.length-1){i++;show()}else finish()}
next.onclick=adv;
document.addEventListener('keydown',function(e){
  var n=parseInt(e.key,10);if(n>=1&&n<=Q[i].o.length&&!done&&card.querySelector('.opt'))pick(n-1);
  else if((e.key=='Enter'||e.key==' ')&&!next.disabled&&document.activeElement.tagName!='BUTTON'){e.preventDefault();next.onclick()}
});
show();
})();
</script>
</body>
</html>
